# GitHub Pages: publishes the JS client to
# https://rubentipparach.github.io/tenebris/ (landing page) and
# https://rubentipparach.github.io/tenebris/js/ (the game) on every push to
# main, or by hand from the Actions tab (Run workflow, any branch - a branch
# may need allowing under Settings > Environments > github-pages >
# Deployment branches).
#
# Needs Pages enabled once: Settings > Pages > Source: GitHub Actions.
# The "Enable GitHub Pages" step tries to switch it on itself; when the
# workflow token isn't allowed to, it fails there with that instruction
# instead of a bare 404 at the deploy step.
name: GitHub Pages deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; a newer push waits for the one in flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build dist (landing page + game)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages (Settings > Pages > Source - GitHub Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      - name: Build JS + landing
        run: npm run build:all

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to rubentipparach.github.io/tenebris
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
