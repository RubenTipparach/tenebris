# Continuous build + deploy for Tenebris.
#
# Every push to every branch builds the JS client (the dist/ landing
# build, the heavyphoton.com/tenebris/ build and the itch.io zip) and
# deploys the dedicated server to Fly.io. GitHub Pages
# auto-deploy is DISABLED (the Pages `deploy` job was removed by
# request) - the build still produces dist/ and uploads it as a
# downloadable artifact, but nothing publishes it to
# rubentipparach.github.io. Re-enable by restoring the `deploy` job +
# its pages-artifact upload + the `pages: write` / `id-token: write`
# permissions.
#
# THE C / WASM CLIENT IS NO LONGER BUILT HERE. tenebris-c/ is a frozen
# archive (see CLAUDE.md) and all work happens in tenebris-rs/, which
# has its own CI in rust.yml - so this workflow no longer installs
# Emscripten / Ninja or links tenebris.html. The experimental
# `webgpu-build` job went with it: emdawnwebgpu requires linking as C++
# (`emcc: error: emdawnwebgpu requires C++`), nothing depended on the
# job, and the archive isn't worth fixing. The archive is still
# buildable by hand with `npm run build:wasm` in a shell that has
# Emscripten activated.
#
# Single-dev / fast-iteration mode - whoever pushed last wins the live
# server. Tighten to a branch allowlist later if the project grows
# contributors.
#
# Fly deploy requires a FLY_API_TOKEN repo secret (scoped deploy
# token from `fly tokens create deploy -a tenebris-c`, including the
# 'FlyV1 ' prefix). Without it the deploy step fails fast.
name: JS client - build + Rust server - deploy to Fly

on:
  # Push covers branch commits AND PR synchronize events (a PR
  # synchronize is itself a push to the head branch in this repo).
  # We used to ALSO list `pull_request: branches: ['**']` here, but
  # that fired its own workflow run on top of the push run for the
  # same commit - two identical builds in parallel. Dropped since
  # this repo doesn't take fork PRs (single-dev mode, see the
  # top-of-file comment); revisit if external contributors land and
  # PR-only runs become necessary for the no-write-access case.
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (leave empty for current branch)'
        required: false
        default: ''

# GitHub Pages deploy is disabled, so the `pages: write` / `id-token: write`
# permissions it needed are dropped; the build only reads the repo.
permissions:
  contents: read

# One deploy at a time across the whole repo, not per-ref, so a newer
# push cleanly supersedes an older in-flight Fly deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      - name: Build JS + landing
        run: npm run build:all

      - name: Verify dist layout
        run: |
          set -e
          test -f dist/index.html       || { echo "missing dist/index.html"; exit 1; }
          test -f dist/js/index.html    || { echo "missing dist/js/index.html"; exit 1; }

      # The two places the JS client actually ships: heavyphoton.com/tenebris/
      # (copied into the heavyphoton.github.io repo's docs/tenebris/ with
      # ./build.sh deploy) and itch.io (tenebris-itch.zip from ./itch-build.sh).
      # Build both on every push so a broken deploy shows up here first.
      - name: Build heavyphoton.com variant (base /tenebris/)
        run: |
          set -e
          npm run build:site
          test -f dist-site/index.html || { echo "missing dist-site/index.html"; exit 1; }
          grep -q 'src="/tenebris/assets/index-' dist-site/index.html \
            || { echo "dist-site/index.html does not load /tenebris/assets/"; exit 1; }

      - name: Build itch.io zip
        run: |
          set -e
          ./itch-build.sh
          unzip -l tenebris-itch.zip | grep -q ' index.html$' \
            || { echo "index.html is not at the root of tenebris-itch.zip"; exit 1; }
          # itch serves from an unknown sub-path: nothing may be absolute
          if grep -q 'src="/' dist-itch/index.html; then
            echo "dist-itch/index.html has an absolute script path"; exit 1
          fi

      - name: Upload heavyphoton.com build
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tenebris-site-${{ github.sha }}
          path: dist-site
          retention-days: 3

      - name: Upload itch.io zip
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tenebris-itch-${{ github.sha }}
          path: tenebris-itch.zip
          retention-days: 3

      # Deploying (itch.io + heavyphoton.com) lives in js-deploy.yml, which runs
      # on pushes to main.

      # Non-blocking: the compile + "Verify dist layout" above already gate
      # real build breaks. This upload is a convenience download only, so an
      # Actions storage-quota hit (or any upload-service blip) must NOT red the
      # build check. Retention trimmed to 3 days to keep the artifact footprint
      # small - the quota fills from 14-day copies stacking up per push.
      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tenebris-dist-${{ github.sha }}
          path: dist
          retention-days: 3

      # GitHub Pages publish disabled by request: no upload-pages-artifact
      # step and no `deploy` job. dist/ ships only as the downloadable
      # tenebris-dist artifact above.

      # ---------------------------------------------------------------
      # Server deploy. Folded into the build job so a single push gives
      # you a single "Run workflow" button + a single status indicator
      # for the whole pipeline. Cold-cache depot builds can take 5-8 min;
      # --wait-timeout 900 (15 min) leaves headroom without giving up
      # early. --verbose makes failures self-diagnose in the run log.
      #
      # The server behind the 'tenebris-c' Fly app is the RUST
      # implementation (tenebris-rs/crates/tenebris-server) - the C
      # server is retired (its config lives on as
      # tenebris-c/fly.toml.retired, the emergency rollback path). The
      # app keeps the C-era name because wss://tenebris-c.fly.dev/ is
      # an on-wire identifier baked into every client. Saves carry
      # over: the volume + format are byte-compatible by porting rule.
      # ---------------------------------------------------------------
      # Both Fly steps are non-blocking: flyctl setup downloads the binary
      # from Fly's servers (has 503'd during Fly outages) and the deploy talks
      # to Fly too. A Fly-side outage must not red the build check - the WASM
      # build is already done and validated above. When Fly is up these still
      # deploy the server normally; when it's down the step goes yellow, not red.
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        continue-on-error: true

      - name: Deploy server to Fly.io (Rust)
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: tenebris-rs
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN repo secret is not set."
            echo "::error::Get a deploy-scoped token via:  fly tokens create deploy -a tenebris-c"
            echo "::error::Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          flyctl deploy --remote-only --wait-timeout 900 --verbose

  # The experimental `webgpu-build` job (Stage 0 of the C tree's
  # compute-shader track, tenebris-c/plan-webgpu-compute.md) is REMOVED.
  # It built tenebris-c with -DTENEBRIS_WEBGPU=ON and had been failing at
  # link: the emdawnwebgpu port requires linking as C++ (em++ /
  # -sDEFAULT_TO_CXX) and the C tree links with emcc. The C tree is a
  # frozen archive and the Rust port is the live target, so the job was
  # dropped rather than fixed. Nothing depended on it - it was
  # continue-on-error with no dependents.

  # GitHub Pages `deploy` job removed by request - the site no longer
  # auto-publishes to rubentipparach.github.io on push. To re-enable,
  # restore this job (needs: build), the pages-artifact upload in the
  # build job, and the pages/id-token permissions at the top.
