# Continuous build for the Tenebris JS client.
#
# Every push to main builds the JS client (the dist/ landing build, the
# heavyphoton.com/tenebris/ build and the itch.io zip) and checks the JS
# multiplayer server. Branches only build when run by hand (Run workflow).
# Publishing to GitHub Pages is its own workflow: pages.yml. Deploys to itch.io,
# heavyphoton.com and the Fly server live in js-deploy.yml and run from
# main.
#
# THE C / WASM CLIENT IS NO LONGER BUILT HERE. tenebris-c/ is a frozen
# archive (see CLAUDE.md) and all work happens in tenebris-rs/, which
# has its own CI in rust.yml - so this workflow no longer installs
# Emscripten / Ninja or links tenebris.html. The experimental
# `webgpu-build` job went with it: emdawnwebgpu requires linking as C++
# (`emcc: error: emdawnwebgpu requires C++`), nothing depended on the
# job, and the archive isn't worth fixing. The archive is still
# buildable by hand with `npm run build:wasm` in a shell that has
# Emscripten activated.
#
# The Rust server used to be deployed to Fly from here on every push to
# every branch. The JS server (server-js/) has replaced it on the
# 'tenebris' app and is deployed from main by js-deploy.yml.
name: JS client - build + check (site, itch zip, server-js)

on:
  # Only main builds automatically (and publishes to Pages); branch pushes
  # don't run CI. Run it by hand on any branch from the Actions tab
  # (Run workflow) when a branch build is wanted.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (leave empty for current branch)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: js-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dist, heavyphoton.com and itch.io builds; check server-js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      - name: Build JS + landing
        run: npm run build:all

      - name: Verify dist layout
        run: |
          set -e
          test -f dist/index.html       || { echo "missing dist/index.html"; exit 1; }
          test -f dist/js/index.html    || { echo "missing dist/js/index.html"; exit 1; }

      # The two places the JS client actually ships: heavyphoton.com/tenebris/
      # (copied into the heavyphoton.github.io repo's docs/tenebris/ with
      # ./build.sh deploy) and itch.io (tenebris-itch.zip from ./itch-build.sh).
      # Build both on every push so a broken deploy shows up here first.
      - name: Build heavyphoton.com variant (base /tenebris/)
        run: |
          set -e
          npm run build:site
          test -f dist-site/index.html || { echo "missing dist-site/index.html"; exit 1; }
          grep -q 'src="/tenebris/assets/index-' dist-site/index.html \
            || { echo "dist-site/index.html does not load /tenebris/assets/"; exit 1; }

      - name: Build itch.io zip
        run: |
          set -e
          ./itch-build.sh
          unzip -l tenebris-itch.zip | grep -q ' index.html$' \
            || { echo "index.html is not at the root of tenebris-itch.zip"; exit 1; }
          # itch serves from an unknown sub-path: nothing may be absolute
          if grep -q 'src="/' dist-itch/index.html; then
            echo "dist-itch/index.html has an absolute script path"; exit 1
          fi

      - name: Upload heavyphoton.com build
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tenebris-site-${{ github.sha }}
          path: dist-site
          retention-days: 3

      - name: Upload itch.io zip
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tenebris-itch-${{ github.sha }}
          path: tenebris-itch.zip
          retention-days: 3

      # Deploying (itch.io + heavyphoton.com) lives in js-deploy.yml, which runs
      # on pushes to main.

      # Non-blocking: the compile + "Verify dist layout" above already gate
      # real build breaks. This upload is a convenience download only, so an
      # Actions storage-quota hit (or any upload-service blip) must NOT red the
      # build check. Retention trimmed to 3 days to keep the artifact footprint
      # small - the quota fills from 14-day copies stacking up per push.
      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tenebris-dist-${{ github.sha }}
          path: dist
          retention-days: 3

      # The JS multiplayer server (server-js/) - install and syntax-check it
      # here; js-deploy.yml deploys it to the 'tenebris' Fly app from main.
      # (The Rust server is no longer deployed by CI: the JS server replaced
      # it on tenebris-c. tenebris-rs/fly.toml still deploys it by hand.)
      - name: Check JS multiplayer server
        working-directory: server-js
        run: |
          npm ci --omit=dev
          for f in *.js; do node --check "$f"; done
          # the admin monitor end to end: a fake client's pose, status
          # frame and map reach the admin API (openspec admin-monitor)
          node --test test/admin-monitor.test.mjs
          # shared objects + chat (openspec mp-shared-objects): two clients
          # moving items in one chest end with the right totals, a stale
          # write is refused, chat is relayed / capped / rate-limited
          node --test test/shared-objects.test.mjs

      # The admin portal's game data (server-js/game-data.json) is generated
      # from the game's config; this fails when it drifts (regenerate with
      # npx tsx scripts/gen-admin-data.ts), and checks the server's map
      # projection and status frame against the client's
      - name: Admin monitor - game data drift, projection, status frame
        run: npx --yes tsx scripts/admin-monitor.test.ts

      # Shared objects + chat, client side (openspec mp-shared-objects): the
      # compare-and-set write queue and its rollback, in-place panel refresh,
      # one simulator per planet, chat line parsing / formatting
      - name: Shared objects + chat - conflict rule, refresh, simulator, chat lines
        run: npx --yes tsx scripts/shared-objects.test.ts

      # Only the cargo hold flies (openspec pad-stash): boarding at a pad
      # stashes the carried items (gear exempt by config), a parked rocket's
      # hold takes them or the board is refused, older pads load unchanged
      - name: Pad stash - stash on board, merge, take back, hold-only away from a pad
        run: npx --yes tsx scripts/pad-stash.test.ts

  # The experimental `webgpu-build` job (Stage 0 of the C tree's
  # compute-shader track, tenebris-c/plan-webgpu-compute.md) is REMOVED.
  # It built tenebris-c with -DTENEBRIS_WEBGPU=ON and had been failing at
  # link: the emdawnwebgpu port requires linking as C++ (em++ /
  # -sDEFAULT_TO_CXX) and the C tree links with emcc. The C tree is a
  # frozen archive and the Rust port is the live target, so the job was
  # dropped rather than fixed. Nothing depended on it - it was
  # continue-on-error with no dependents.
