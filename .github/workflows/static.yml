# Continuous build + deploy for Tenebris.
#
# Every push to every branch builds AND deploys to GitHub Pages. Single-
# dev / fast-iteration mode — whoever pushed last wins the live site.
# Tighten to a branch allowlist later if the project grows contributors.
name: Build and deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (leave empty for current branch)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time across the whole repo, not per-ref, so a newer
# push cleanly supersedes an older in-flight deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_wasm: ${{ steps.check.outputs.has_wasm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: 'emsdk-cache'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install node dependencies
        run: npm ci

      - name: Build JS + WASM + landing
        run: npm run build:all

      - name: Verify dist layout
        id: check
        run: |
          set -e
          test -f dist/index.html       || { echo "missing dist/index.html"; exit 1; }
          test -f dist/js/index.html    || { echo "missing dist/js/index.html"; exit 1; }
          test -f dist/wasm/index.html  || { echo "missing dist/wasm/index.html"; exit 1; }
          echo "has_wasm=true" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: tenebris-dist-${{ github.sha }}
          path: dist
          retention-days: 14

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
