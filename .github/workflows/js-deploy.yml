# JS client deploy.
#
# - On every push to main: only heavyphoton.com/tenebris/ updates.
# - itch.io + the multiplayer server are a MANUAL release, together: run
#   this workflow by hand (Actions > this workflow > Run workflow, branch
#   main). Pick what to ship:
#     itch + server  (default) the Fly server deploys only after the
#                    itch.io push succeeds, so the server players connect
#                    to always matches the itch build
#     server only    just the multiplayer server (a server fix, or its
#                    first deploy) - no itch.io push
#   The server's admin portal (https://tenebris-c.fly.dev/admin) needs an
#   ADMIN_TOKEN Fly secret: fly secrets set ADMIN_TOKEN=... -a tenebris-c
#
# - itch.io: builds tenebris-itch.zip and pushes it with butler to
#   https://ruben-tipparach.itch.io/tenebris (channel html5). Needs a
#   BUTLER_API_KEY secret (itch.io -> Settings -> API keys).
# - multiplayer server: deploys server-js/ to the 'tenebris-c' Fly app
#   (wss://tenebris-c.fly.dev/, the clients' default server), replacing the
#   Rust server there. Needs the FLY_API_TOKEN secret (a deploy token for
#   tenebris-c, the same one the Rust deploy used).
# - heavyphoton.com/tenebris/: pings heavyphoton.github.io, whose
#   deploy-tenebris workflow builds this commit into docs/tenebris. Needs a
#   SITE_DISPATCH_TOKEN secret: a fine-grained PAT for
#   heavyphoton.github.io with Contents: read and write. Without it the
#   site still picks the change up on its hourly check.
name: JS client - release (itch.io + Fly.io server manual, heavyphoton.com on push)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ship:
        description: What to release
        type: choice
        default: itch + server
        options:
          - itch + server
          - server only

permissions:
  contents: read

concurrency:
  group: js-deploy
  cancel-in-progress: false

jobs:
  itch:
    name: itch.io - butler push ruben-tipparach/tenebris:html5
    # manual releases only, unless just the server was asked for
    if: github.event_name == 'workflow_dispatch' && inputs.ship != 'server only'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for the butler key
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::BUTLER_API_KEY secret is not set - add it under Settings > Secrets and variables > Actions (key from https://itch.io/user/settings/api-keys)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build tenebris-itch.zip
        run: |
          set -e
          npm ci
          ./itch-build.sh
          unzip -l tenebris-itch.zip | grep -q ' index.html$'

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -e
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push tenebris-itch.zip ruben-tipparach/tenebris:html5 --userversion "${GITHUB_SHA::7}"

  site:
    name: heavyphoton.com - trigger docs/tenebris rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the heavyphoton.github.io deploy
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN secret not set - heavyphoton.com picks this up on its hourly check instead."
            exit 0
          fi
          curl -sSf -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/RubenTipparach/heavyphoton.github.io/dispatches \
            -d "{\"event_type\":\"tenebris-updated\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
          echo "heavyphoton.com deploy triggered"

  server:
    name: Fly.io - deploy server-js to tenebris-c
    # ships with the itch.io release, after it succeeds - or alone when
    # 'server only' was picked
    needs: itch
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (needs.itch.result == 'success' || (inputs.ship == 'server only' && needs.itch.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for the Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set - create one with: fly tokens create deploy -a tenebris-c"
            exit 1
          fi

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy server-js to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: server-js
        run: flyctl deploy --remote-only --config fly.toml --wait-timeout 600
