# Fly config for the JS multiplayer server (server-js/), deployed by
# .github/workflows/js-deploy.yml on every push to main.
#
# It REPLACES the Rust server on the 'tenebris-c' app (the clients'
# default URL is wss://tenebris-c.fly.dev/). The Rust server, its /admin
# portal and tile editor are no longer served while this is deployed; to
# go back, deploy tenebris-rs/fly.toml. The volume is kept: the JS server
# writes its own file (/data/js-edits.log) next to the Rust saves and does
# not touch them.
#
# Manual deploy, from server-js/:
#   fly deploy --config fly.toml

app = 'tenebris-c'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '5s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source      = "tenebris_saves"
  destination = "/data"
