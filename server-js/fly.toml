# Fly config for the JS multiplayer server (server-js/), deployed by
# .github/workflows/js-deploy.yml - run it by hand (Actions > JS client -
# release > Run workflow): "itch + server" ships both together, "server
# only" redeploys just this.
#
# It runs on the 'tenebris' app (the clients' default URL is
# wss://tenebris.fly.dev/; the old 'tenebris-c' app that held the Rust
# server is gone), with this server's own /admin portal (admin.js, needs the ADMIN_TOKEN secret:
#   fly secrets set ADMIN_TOKEN=<long random string> -a tenebris
# ). The volume is shared: the JS worlds live under /data/worlds/ and the
# Rust saves beside them are left alone.
#
# One machine, one volume (the worlds are on it). First time:
#   fly volumes create tenebris_saves -a tenebris -r ord --size 1
# Manual deploy, from server-js/:
#   fly deploy --config fly.toml --ha=false

app = 'tenebris'
primary_region = 'ord'

# The admin portal (/admin) is OPEN: no token needed (owner, for now).
# Delete this [env] block to require the ADMIN_TOKEN secret again.
[env]
  ADMIN_OPEN = '1'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '5s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source      = "tenebris_saves"
  destination = "/data"
