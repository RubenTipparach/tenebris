# Fly config for the JS multiplayer server (server-js/), deployed by
# .github/workflows/js-deploy.yml - run it by hand (Actions > JS client -
# release > Run workflow): "itch + server" ships both together, "server
# only" redeploys just this.
#
# It REPLACES the Rust server on the 'tenebris-c' app (the clients'
# default URL is wss://tenebris-c.fly.dev/), so the Rust /admin portal is
# replaced by this server's own (admin.js, needs the ADMIN_TOKEN secret:
#   fly secrets set ADMIN_TOKEN=<long random string> -a tenebris-c
# ). The volume is shared: the JS worlds live under /data/worlds/ and the
# Rust saves beside them are left alone.
#
# Manual deploy, from server-js/:
#   fly deploy --config fly.toml

app = 'tenebris-c'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '5s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source      = "tenebris_saves"
  destination = "/data"
