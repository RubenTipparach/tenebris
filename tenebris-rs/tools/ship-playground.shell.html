<!-- Tenebris Drydock - interactive modular-ship assembly bay.

     Companion to MODULAR_SHIP_PLAN.md: the part geometry, attachment nodes
     and stats below are generated by tools/gen-ship-parts.py (run it with
     --json to regenerate the embedded blob), and the readout is computed
     from the plan's own formulas - section 2.2's damping solve, 2.3's
     parallel-axis inertia, 2.9's [ship] constants, and the planet's real
     g = 25 m/s^2. Built to pressure-test the design before it is written.

     Published as an Artifact; also opens directly in a browser from disk
     (there are deliberately no <html>/<body> wrapper tags - the Artifact
     host supplies them, and browsers synthesize them for a local file).
     Needs network access for three.js from cdnjs and the Google fonts. -->
<meta charset="utf-8">
<title>Tenebris Drydock</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  /* Committed single-theme instrument panel: a drydock console reads as a
     lit bay against a dark hangar, so every colour is painted explicitly
     and nothing is inherited from the host ground. */
  :root {
    --void:    #10141b;
    --bay:     #151b24;
    --panel:   #181e27;
    --raised:  #1e2531;
    --rule:    #29323f;
    --ink:     #dde3ec;
    --ink-dim: #8794a5;
    --ink-faint:#5c6879;
    --amber:   #d99a3c;
    --amber-d: #7a5620;
    --engine:  #4dc9d6;
    --fault:   #e0653c;
    --ok:      #5fbf7d;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --disp: "Chakra Petch", "IBM Plex Sans", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- frame ---------------------------------------------------- */
  .shell {
    display: grid;
    grid-template-columns: 244px 1fr 296px;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }

  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--rule);
  }
  .wordmark {
    font-family: var(--disp);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .10em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .wordmark span { color: var(--amber); }
  .tagline {
    color: var(--ink-faint);
    font-size: 12px;
    border-left: 1px solid var(--rule);
    padding-left: 18px;
  }
  .spacer { flex: 1; }

  button {
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--ink);
    background: var(--raised);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 6px 11px;
    cursor: pointer;
  }
  button:hover { border-color: var(--amber-d); color: #fff; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  button.on { background: var(--amber-d); border-color: var(--amber); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--amber-d); border-color: var(--amber); }

  /* ---- panels ---------------------------------------------------- */
  aside {
    background: var(--panel);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  aside.left  { border-right: 1px solid var(--rule); }
  aside.right { border-left: 1px solid var(--rule); }

  .sect-head {
    font-family: var(--disp);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 13px 14px 7px;
  }

  .fleet { display: flex; flex-direction: column; padding-bottom: 4px; }
  .role-head {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-faint);
    padding: 7px 14px 3px;
  }
  .ship {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    width: 100%; padding: 5px 14px; border: 0; border-left: 2px solid transparent;
    border-radius: 0; background: none; text-align: left;
  }
  .ship:hover { background: var(--raised); border-left-color: var(--amber-d); }
  .ship.on { background: var(--raised); border-left-color: var(--amber); }
  .ship .sn { font-size: 12.5px; color: var(--ink); }
  .ship .sk { font-size: 10.5px; color: var(--ink-faint); }
  .ship .st {
    font-family: var(--mono); font-size: 10px; color: var(--ink-faint);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* parts catalogue: one repeated object, same edges throughout */
  .cat { display: flex; flex-direction: column; }
  .part {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 10px;
    align-items: center;
    padding: 8px 14px;
    border: 0;
    border-left: 2px solid transparent;
    border-radius: 0;
    background: none;
    text-align: left;
    width: 100%;
  }
  .part:hover { background: var(--raised); border-left-color: var(--amber-d); }
  .part.held  { background: var(--raised); border-left-color: var(--amber); }
  .part canvas { width: 34px; height: 34px; display: block; }
  .part .nm { font-size: 12.5px; color: var(--ink); line-height: 1.25; }
  .part .rl { font-size: 10.5px; color: var(--ink-faint); font-family: var(--mono); }

  /* ---- 3D bay ---------------------------------------------------- */
  main { position: relative; background: var(--bay); overflow: hidden; }
  #bay { display: block; width: 100%; height: 100%; }

  .hint {
    position: absolute;
    left: 14px; bottom: 14px;
    display: flex; align-items: center; gap: 9px;
    background: rgba(16, 20, 27, .88);
    border: 1px solid var(--rule);
    border-left: 2px solid var(--amber);
    border-radius: 3px;
    padding: 8px 12px;
    font-size: 12.5px;
    color: var(--ink);
    max-width: 62%;
  }
  .hint b { font-weight: 600; color: var(--amber); }

  .viewnote {
    position: absolute; right: 14px; bottom: 14px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    text-align: right; line-height: 1.5;
  }

  /* ---- readout ---------------------------------------------------- */
  .rows { padding: 0 14px 10px; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; padding: 5px 0;
    border-bottom: 1px solid rgba(41, 50, 63, .55);
  }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--ink-dim); font-size: 12px; }
  .row .v {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap;
  }
  .row .v.eng { color: var(--engine); }
  .row .v.warn { color: var(--fault); }
  .row .v.good { color: var(--ok); }
  .row .v small { color: var(--ink-faint); font-weight: 400; }

  /* the two figures a pilot actually flies by get the lift */
  .headline {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--rule); margin: 4px 14px 12px; border: 1px solid var(--rule);
  }
  .fig { background: var(--raised); padding: 10px 12px; }
  .fig .k {
    font-family: var(--disp); font-size: 9.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .fig .v {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 21px; font-weight: 600; color: var(--ink); line-height: 1.25;
  }
  .fig .v small { font-size: 11px; color: var(--ink-faint); font-weight: 400; }
  .fig.twr .v.bad { color: var(--fault); }
  .fig.twr .v.ok  { color: var(--ok); }

  .faults { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 5px; }
  .fault {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 12px; line-height: 1.45;
    border-left: 2px solid var(--fault);
    background: rgba(224, 101, 60, .09);
    padding: 6px 9px;
    color: var(--ink);
  }
  .fault.warn { border-left-color: var(--amber); background: rgba(217, 154, 60, .09); }
  .fault.ok   { border-left-color: var(--ok); background: rgba(95, 191, 125, .08); color: var(--ink-dim); }

  .sel {
    margin: 0 14px 12px; padding: 10px 12px;
    background: var(--raised); border: 1px solid var(--rule);
  }
  .sel h4 {
    margin: 0 0 3px; font-family: var(--disp); font-size: 13px;
    font-weight: 600; letter-spacing: .02em;
  }
  .sel p { margin: 0 0 9px; font-size: 12px; color: var(--ink-dim); line-height: 1.5; }
  .sel .btns { display: flex; gap: 6px; }

  .exportbox {
    margin: 0 14px 14px; padding: 9px 10px;
    background: #0d1117; border: 1px solid var(--rule);
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim);
    word-break: break-all; line-height: 1.5; max-height: 74px; overflow-y: auto;
  }

  .saved { padding: 0 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .saved button {
    display: flex; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; font-size: 12px;
  }
  .saved button em { color: var(--ink-faint); font-style: normal; font-family: var(--mono); font-size: 10.5px; }
  .note { padding: 0 14px 14px; font-size: 11.5px; color: var(--ink-faint); line-height: 1.5; }

  @media (max-width: 900px) {
    body { overflow: auto; height: auto; }
    .shell { grid-template-columns: 1fr; height: auto; }
    main { height: 60vh; min-height: 340px; }
    aside { max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="shell">
  <header>
    <div class="wordmark">Tenebris <span>Drydock</span></div>
    <div class="tagline">Modular ship assembly &mdash; mockup parts, real flight math</div>
    <div class="spacer"></div>
    <button id="symBtn" class="on" title="Mirror radial parts across the centreline">Symmetry</button>
    <button id="clearBtn">Clear</button>
    <button id="saveBtn" class="primary" hidden>Save design</button>
  </header>

  <aside class="left">
    <div class="sect-head">Test fleet</div>
    <div class="fleet" id="fleet"></div>
    <div class="sect-head">Parts</div>
    <div class="cat" id="cat"></div>
    <div class="note" id="catNote"></div>
  </aside>

  <main>
    <canvas id="bay"></canvas>
    <div class="hint" id="hint"></div>
    <div class="viewnote">drag &middot; orbit<br>wheel &middot; zoom</div>
  </main>

  <aside class="right">
    <div class="sect-head">Flight readout</div>
    <div class="headline">
      <div class="fig twr"><div class="k">Thrust / weight</div><div class="v" id="fTwr">&mdash;</div></div>
      <div class="fig"><div class="k">Cruise speed</div><div class="v" id="fCruise">&mdash;</div></div>
    </div>

    <div id="savedWrap"></div>

</div>

<script>
/* ------------------------------------------------------------------ *
 * Part catalogue, generated by tools/gen-ship-parts.py. Vertices and
 * attachment nodes are the same numbers the .obj / .json sidecars carry,
 * so what you assemble here is what the game would assemble.
 * ------------------------------------------------------------------ */
const PARTS_RAW = __PARTS_JSON__;

/* Twenty test ships, built and flight-checked by
 * tools/gen-ship-presets.py - it refuses to emit a preset whose
 * nodes do not exist, whose TWR is under 1, or that cannot turn. */
const FLEET = __FLEET_JSON__;

/* Rules shared with the generator, exported as data by
 * tools/gen-ship-parts.py --meta so neither side can drift:
 *   structural_kinds - mounts that interchange freely
 *   emissive_colors  - materials drawn as a light, not shaded */
const META = __META_JSON__;
const EMISSIVE = new Set(META.emissive_colors.map(c => c.toLowerCase()));
const STRUCTURAL = new Set(META.structural_kinds);

/* Structural mounts interchange; every other kind is a TOOL mount and is
 * exclusive, so a drill only ever lands on a Drill node. */
function mates(parentKind, childKind) {
  if (STRUCTURAL.has(parentKind) && STRUCTURAL.has(childKind)) return true;
  return parentKind === childKind;
}

/* Flight constants: MODULAR_SHIP_PLAN.md section 2.9 [ship] plus the
 * planet's real surface gravity (planet.rs SURFACE_GRAVITY_MPS2_PER_G).
 * The readout below is those formulas, not invented numbers. */
const CFG = {
  g: 25.0,            // Tenebris surface gravity, m/s^2
  kLin: 0.40,         // linear_damp_hz, flight assist on
  kQuad: 0.0004,      // linear_damp_quad
  kAng: 3.0,          // angular_damp_hz
  maxAngRate: 1.6,    // max_ang_rate_rads
  minInertia: 200.0,  // min_inertia_kgm2
  maxParts: 24,
  offAxisWarnDeg: 12  // thrust_offaxis_max_deg
};

const PARTS = {};
PARTS_RAW.forEach(p => { PARTS[p.id] = p; });

/* Mirrored variant: x-negated vertices with reversed winding, and nodes
 * mirrored to match. Symmetry places this, so a port wing is a true
 * reflection of the starboard one rather than a rotated copy (a rotation
 * would flip the sweep backwards). */
function mirrorPart(p) {
  return {
    ...p,
    mesh: {
      v: p.mesh.v.map(v => [-v[0], v[1], v[2]]),
      t: p.mesh.t,
      /* reversing the winding must carry the UV corners with it, or the
       * mirrored copy samples the atlas back-to-front */
      f: p.mesh.f.map(f => [f[2], f[1], f[0], f[5], f[4], f[3], f[6]])
    },
    nodes: p.nodes.map(n => ({
      pos: [-n.pos[0], n.pos[1], n.pos[2]],
      dir: [-n.dir[0], n.dir[1], n.dir[2]],
      kind: n.kind
    }))
  };
}
const MIRRORED = {};
PARTS_RAW.forEach(p => { MIRRORED[p.id] = mirrorPart(p); });
const defOf = inst => (inst.mir ? MIRRORED : PARTS)[inst.part];

/* ---------------- ship graph ---------------- */
/* instance: {part, parent (index or -1), node (parent node index), roll, mir} */
let ship = [];
let held = null;      // part id picked from the catalogue
let selected = -1;    // index of the selected instance
let symmetry = true;

/* A chiral part (a swept wing) has no rotation that turns a starboard
 * copy into a port one - only a reflection does. So when mating, try both
 * the plain and the mirrored definition and keep whichever needs the
 * SMALLER rotation: on a -X node the mirrored wing mates with no rotation
 * at all, while the plain one needs 180 degrees about Y, which flips the
 * sweep forwards. Symmetric parts tie at 0 and keep the plain one. */
function bestMir(nodeDirWorld, partId) {
  const ang = (def) => {
    const q = new THREE.Quaternion().setFromUnitVectors(
      V(def.nodes[0].dir).normalize(), nodeDirWorld.clone().negate());
    return 2 * Math.acos(Math.min(1, Math.abs(q.w)));
  };
  return ang(MIRRORED[partId]) < ang(PARTS[partId]) - 1e-3;
}

/* Opens on a flyable ship rather than an empty bay, so the readout shows
 * real figures the moment the page loads. */
function starter() {
  ship = [{ part: 'cockpit', parent: -1, node: 0, roll: 0, mir: false, twin: -1 }];
  addPart(0, 0, 'fuselage_bay');   // 1: spine, aft of the cockpit
  addPart(1, 1, 'fuel_cell');      // 2: tank on the tail of the spine
  addPart(1, 3, 'wing');           // 3 + 4: wing pair on the flanks
  addPart(3, 1, 'nacelle');        // 5 + 6: a nacelle under each wing
  addPart(1, 4, 'tail_fin');       // 7: fin on the spine's back
  selected = -1;
}

/* ---------------- transforms ---------------- */
const V = (a) => new THREE.Vector3(a[0], a[1], a[2]);

/* Solve every instance's world pose, parents before children (a child's
 * index always exceeds its parent's, so one forward pass suffices). */
function solve() {
  const out = [];
  for (let i = 0; i < ship.length; i++) {
    const inst = ship[i], def = defOf(inst);
    if (inst.parent < 0) {
      out.push({ pos: new THREE.Vector3(), quat: new THREE.Quaternion() });
      continue;
    }
    const pt = out[inst.parent];
    if (!pt) { out.push(null); continue; }
    const pdef = defOf(ship[inst.parent]);
    const pn = pdef.nodes[inst.node];
    if (!pn) { out.push(null); continue; }
    const nodePos = V(pn.pos).applyQuaternion(pt.quat).add(pt.pos);
    const nodeDir = V(pn.dir).applyQuaternion(pt.quat).normalize();

    const myDir = V(def.nodes[0].dir).normalize();
    const q = new THREE.Quaternion().setFromUnitVectors(myDir, nodeDir.clone().negate());
    if (inst.roll) {
      q.premultiply(new THREE.Quaternion().setFromAxisAngle(nodeDir, inst.roll * Math.PI / 2));
    }
    const off = V(def.nodes[0].pos).applyQuaternion(q);
    out.push({ pos: nodePos.clone().sub(off), quat: q });
  }
  return out;
}

/* Free nodes: every node of every instance that no child occupies. */
function freeNodes(poses) {
  const taken = new Set();
  ship.forEach(inst => { if (inst.parent >= 0) taken.add(inst.parent + ':' + inst.node); });
  const free = [];
  ship.forEach((inst, i) => {
    const def = defOf(inst), t = poses[i];
    if (!t) return;
    def.nodes.forEach((n, ni) => {
      if (ni === 0 && inst.parent >= 0) return;      // node 0 mates the parent
      if (taken.has(i + ':' + ni)) return;
      free.push({
        inst: i, node: ni, kind: n.kind,
        pos: V(n.pos).applyQuaternion(t.quat).add(t.pos),
        dir: V(n.dir).applyQuaternion(t.quat).normalize()
      });
    });
  });
  return free;
}

/* Mirror partner of a node: the node on the same parent whose position is
 * this one's x-reflection. Symmetry needs it so the pair lands on real
 * opposing nodes rather than a guessed offset. */
function partnerNode(instIdx, nodeIdx) {
  const def = defOf(ship[instIdx]);
  const n = def.nodes[nodeIdx];
  if (Math.abs(n.pos[0]) < 0.05) return -1;          // on the centreline
  for (let i = 0; i < def.nodes.length; i++) {
    const m = def.nodes[i];
    if (i !== nodeIdx &&
        Math.abs(m.pos[0] + n.pos[0]) < 0.02 &&
        Math.abs(m.pos[1] - n.pos[1]) < 0.02 &&
        Math.abs(m.pos[2] - n.pos[2]) < 0.02) return i;
  }
  return -1;
}

/* Place one part, plus its mirror when symmetry is on. The mirror of a
 * part hung off a mirrored parent lives on THAT parent's twin (a nacelle
 * under the starboard wing mirrors to the port wing, not to another node
 * on the same wing), so each instance records its twin explicitly. */
function addPart(instIdx, nodeIdx, partId) {
  if (ship.length >= CFG.maxParts) return -1;
  loadedShip = -1;
  const poses = solve();
  const pt = poses[instIdx];
  const pdef = defOf(ship[instIdx]);
  const pn = pdef.nodes[nodeIdx];
  if (!pt || !pn) return -1;
  const dirW = V(pn.dir).applyQuaternion(pt.quat).normalize();
  const mirA = bestMir(dirW, partId);

  const a = ship.length;
  ship.push({ part: partId, parent: instIdx, node: nodeIdx, roll: 0, mir: mirA, twin: -1 });

  if (symmetry && ship.length < CFG.maxParts) {
    const P = ship[instIdx];
    let tParent = -1, tNode = -1;
    if (P.twin >= 0) { tParent = P.twin; tNode = nodeIdx; }
    else {
      const pnIdx = partnerNode(instIdx, nodeIdx);
      if (pnIdx >= 0) { tParent = instIdx; tNode = pnIdx; }
    }
    if (tParent >= 0) {
      const b = ship.length;
      ship.push({ part: partId, parent: tParent, node: tNode, roll: 0, mir: !mirA, twin: a });
      ship[a].twin = b;
    }
  }
  return a;
}

function attach(instIdx, nodeIdx, partId) {
  const a = addPart(instIdx, nodeIdx, partId);
  if (a >= 0) selected = a;
  rebuild();
}

/* Remove an instance and everything hanging off it, plus its symmetry
 * twin, then renumber the parent pointers the splice invalidated. */
function removeAt(idx) {
  if (idx <= 0) return;
  loadedShip = -1;
  const doomed = new Set([idx]);
  if (ship[idx].twin > 0) doomed.add(ship[idx].twin);
  let grew = true;
  while (grew) {
    grew = false;
    ship.forEach((s, i) => {
      if (!doomed.has(i) && doomed.has(s.parent)) { doomed.add(i); grew = true; }
    });
  }
  const keep = ship.map((_, i) => i).filter(i => !doomed.has(i));
  const remap = new Map(keep.map((old, nu) => [old, nu]));
  ship = keep.map(i => ({
    ...ship[i],
    parent: ship[i].parent < 0 ? -1 : remap.get(ship[i].parent),
    twin: remap.has(ship[i].twin) ? remap.get(ship[i].twin) : -1
  }));
  selected = -1;
  rebuild();
}

/* ---------------- landing stance ---------------- */
/* A ship stands up if its centre of mass falls inside the polygon its feet
 * make on the ground - nothing else matters. Counting skids cannot see
 * that: one centred leg is three-quarters of "three or more" and still
 * topples in every direction, and a long hull with all its gear amidships
 * sits down on its tail however many feet it has. So solve the real thing:
 * take each foot's ground contact, hull them, and ask how far inside that
 * polygon the centre of mass sits. */

/* Ground contact of one gear part: the centroid of its lowest vertices. */
function footOf(def, t) {
  const wv = def.mesh.v.map(v => V(v).applyQuaternion(t.quat).add(t.pos));
  let low = Infinity;
  wv.forEach(p => { if (p.y < low) low = p.y; });
  const pad = wv.filter(p => p.y < low + 0.06);
  let x = 0, z = 0;
  pad.forEach(p => { x += p.x; z += p.z; });
  return { x: x / pad.length, z: z / pad.length, y: low };
}

/* Convex hull (monotone chain) of the contact points in the ground plane. */
function hull2(pts) {
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a.x - b.x || a.z - b.z);
  const cr = (o, a, b) => (a.x - o.x) * (b.z - o.z) - (a.z - o.z) * (b.x - o.x);
  const half = src => {
    const out = [];
    src.forEach(q => {
      while (out.length >= 2 && cr(out[out.length - 2], out[out.length - 1], q) <= 0) out.pop();
      out.push(q);
    });
    out.pop();
    return out;
  };
  return half(p).concat(half(p.slice().reverse()));
}

/* Signed distance from the centre of mass to the support polygon: positive
 * inside (the margin before it tips), negative outside (it is already
 * falling). Also names the direction it goes over, because "unstable" on
 * its own does not tell you which end to put a leg under. */
function stanceOf(contacts, com) {
  if (!contacts.length) return { feet: 0, margin: null, dir: '' };
  const groundY = Math.min(...contacts.map(c => c.y));
  /* A foot parked well above the lowest one never reaches the ground, so it
   * cannot hold the ship up and must not count toward the polygon. */
  const feet = contacts.filter(c => c.y < groundY + 0.25);
  const h = hull2(feet);
  const name = (dx, dz) => (Math.abs(dz) >= Math.abs(dx)
    ? (dz > 0 ? 'onto its nose' : 'onto its tail')
    : (dx > 0 ? 'to starboard' : 'to port'));

  if (h.length < 3) {
    /* One foot, or a row of them: no area to stand on. With two or more in
     * a line the ship topples about that line; report the way it falls. */
    let dx = 0, dz = 0;
    if (h.length === 2) {
      const ex = h[1].x - h[0].x, ez = h[1].z - h[0].z;
      const L = Math.hypot(ex, ez) || 1;
      const side = ((com.x - h[0].x) * ez - (com.z - h[0].z) * ex) / L;
      dx = -ez / L * Math.sign(side || 1); dz = ex / L * Math.sign(side || 1);
    } else if (h.length === 1) {
      dx = com.x - h[0].x; dz = com.z - h[0].z;
    }
    return { feet: feet.length, margin: 0, degenerate: true,
             dir: name(dx, dz) };
  }

  let margin = Infinity, dir = '';
  for (let i = 0; i < h.length; i++) {
    const a = h[i], b = h[(i + 1) % h.length];
    const ex = b.x - a.x, ez = b.z - a.z;
    const L = Math.hypot(ex, ez) || 1;
    /* hull2 returns counter-clockwise, so inside is a positive cross of
     * (b-a) x (p-a). Verified against a unit square: centre = +1, a point
     * three units out = -2. The outward normal of a CCW edge is (ez, -ex). */
    const d = (ex * (com.z - a.z) - ez * (com.x - a.x)) / L;
    if (d < margin) { margin = d; dir = name(ez / L, -ex / L); }
  }
  return { feet: feet.length, margin, degenerate: false, dir };
}

/* ---------------- mass properties ---------------- */
function analyse(poses) {
  let mass = 0, thrust = 0, torque = 0, fuelCap = 0, burn = 0, cargo = 0;
  let hasDock = false, hasGear = 0, lift = 0;
  const contacts = [];
  /* Tool output. Rates SUM (two drills cut twice as fast); scan range
   * takes the BEST fit, because range is not additive - a second dish
   * does not see further than the better one alone. */
  let mineRate = 0, loadRate = 0, pumpRate = 0, scanRange = 0;
  const com = new THREE.Vector3();
  const parts = [];

  ship.forEach((inst, i) => {
    const def = PARTS[inst.part], t = poses[i];
    if (!t) return;
    const m = def.mass_kg || 0;
    /* Part centroid in world space, from the mesh bounds - the same
     * geometry the physics would fold, not a guessed offset. */
    const b = new THREE.Box3();
    def.mesh.v.forEach(v => b.expandByPoint(V(v)));
    const cLocal = b.getCenter(new THREE.Vector3());
    const size = b.getSize(new THREE.Vector3());
    const c = cLocal.clone().applyQuaternion(t.quat).add(t.pos);
    mass += m;
    com.addScaledVector(c, m);
    parts.push({ m, c, size });

    if (def.thrust_n) {
      thrust += def.thrust_n;
      burn += def.fuel_per_s || 0;
    }
    torque += def.torque_nm || 0;
    fuelCap += def.fuel_cap || 0;
    if (def.role === 'Rcs') burn += 0;             // RCS only burns while steering
    cargo += def.cargo || 0;
    mineRate += def.mine_rate_m3_s || 0;
    loadRate += def.load_rate_t_s || 0;
    pumpRate += def.pump_rate_l_s || 0;
    scanRange = Math.max(scanRange, def.scan_range_m || 0);
    if (def.has_dock) hasDock = true;
    if (def.role === 'Gear') { hasGear++; contacts.push(footOf(def, t)); }
    lift += (def.lift_area_m2 || 0) * (def.lift_coef || 0);
  });

  if (mass > 0) com.multiplyScalar(1 / mass);
  const stance = stanceOf(contacts, com);

  /* Inertia about the pitch axis: each part a solid box about its own
   * centre plus parallel-axis to the ship CoM (plan section 2.3). */
  let I = 0;
  parts.forEach(p => {
    const self = p.m * (p.size.y * p.size.y + p.size.z * p.size.z) / 12;
    const d = p.c.clone().sub(com);
    I += self + p.m * (d.y * d.y + d.z * d.z);
  });
  I = Math.max(I, CFG.minInertia);

  /* Net thrust and the torque it makes about the CoM. Nacelles push along
   * their own +Z; mounted off-centre they twist the ship, which is the
   * whole point of letting engines go anywhere. */
  const F = new THREE.Vector3();
  const tau = new THREE.Vector3();
  ship.forEach((inst, i) => {
    const def = PARTS[inst.part], t = poses[i];
    if (!t || !def.thrust_n) return;
    const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(t.quat);
    const f = dir.clone().multiplyScalar(def.thrust_n);
    const b = new THREE.Box3();
    def.mesh.v.forEach(v => b.expandByPoint(V(v)));
    const r = b.getCenter(new THREE.Vector3()).applyQuaternion(t.quat).add(t.pos).sub(com);
    F.add(f);
    tau.add(r.clone().cross(f));
  });

  const aMax = mass > 0 ? F.length() / mass : 0;
  /* Terminal cruise solves a_max = k*v + kq*v^2 (plan section 2.2). */
  const cruise = aMax > 0
    ? (-CFG.kLin + Math.sqrt(CFG.kLin * CFG.kLin + 4 * CFG.kQuad * aMax)) / (2 * CFG.kQuad)
    : 0;
  const twr = mass > 0 ? F.length() / (mass * CFG.g) : 0;
  const turn = Math.min(CFG.maxAngRate, torque / (I * CFG.kAng));
  const offDeg = F.length() > 1
    ? THREE.MathUtils.radToDeg(new THREE.Vector3(0, 0, 1).angleTo(F.clone().normalize()))
    : 0;

  return { mass, thrust: F.length(), twr, aMax, cruise, torque, I, turn,
           fuelCap, burn, cargo, hasDock, hasGear, lift, com,
           mineRate, loadRate, pumpRate, scanRange, stance,
           tau: tau.length(), tauVec: tau, offDeg, t90: 2.3 / CFG.kLin };
}

function faultsOf(s) {
  const f = [];
  const has = r => ship.some(i => PARTS[i.part].role === r);
  if (!has('Cockpit')) f.push(['bad', 'No cockpit. Every ship needs exactly one crew module.']);
  if (!has('Engine')) f.push(['bad', 'No engine. Add a nacelle or the ship cannot move.']);
  if (has('Engine') && s.fuelCap <= 0) f.push(['bad', 'No fuel cell. The engines have nothing to burn.']);
  if (s.twr > 0 && s.twr < 1) f.push(['bad', 'Thrust/weight below 1 - it cannot lift off Tenebris.']);
  /* Fire on the RATIO, not the raw torque: 19 kN-m against 208 kN-m of
   * authority is trim, while 25 kN-m against 7 kN-m flips the ship. */
  if (s.tau > 2000 && s.torque > 0 && s.tau / s.torque > 0.35) {
    /* Body axes: +Z nose, +Y up, +X starboard - so torque about X pitches,
     * about Y yaws, about Z rolls. A symmetric pair of nacelles cancels the
     * yaw but NOT the pitch: both sit below the centre of mass, and both
     * push the tail up. Naming the axis is the difference between a useful
     * warning and a mystery. */
    const t = s.tauVec;
    const ax = Math.abs(t.x) >= Math.abs(t.y) && Math.abs(t.x) >= Math.abs(t.z)
      ? 'pitch' : (Math.abs(t.y) >= Math.abs(t.z) ? 'yaw' : 'roll');
    const ratio = (s.tau / s.torque).toFixed(1);
    f.push(['warn', 'Thrust line misses the centre of mass: ' +
      Math.round(s.tau / 1000) + ' kN·m of ' + ax + ' torque under full power, ' +
      ratio + '\u00d7 your control torque. Move the engines onto the hull axis, ' +
      'or add gyros.']);
  }
  if (s.offDeg > CFG.offAxisWarnDeg) f.push(['warn', 'Net thrust is ' + s.offDeg.toFixed(0) +
      '° off the nose axis.']);
  if (s.turn < 0.15 && ship.length > 2) f.push(['warn',
      'Turns at ' + s.turn.toFixed(2) + ' rad/s. Add a reaction wheel or RCS blocks.']);
  if (!s.hasDock) f.push(['warn', 'No docking collar - this ship cannot dock at the station.']);
  /* Stance, judged on the support polygon rather than a skid count. */
  if (s.hasGear > 0) {
    const st = s.stance;
    if (st.feet < s.hasGear) f.push(['warn', (s.hasGear - st.feet) + ' of ' +
        s.hasGear + ' feet hang too high to reach the ground.']);
    if (st.degenerate) {
      f.push(['bad', st.feet < 2
        ? 'One foot on the ground - it falls ' + st.dir + ' the moment it lands. Gear off the centreline needs its mirror; gear on it needs a second set fore or aft.'
        : st.feet + ' feet in a straight line - no base. It topples ' + st.dir + '. Spread them across the hull, not along one axis.']);
    } else if (st.margin <= 0) {
      f.push(['bad', 'Centre of mass falls outside the feet by ' +
        Math.abs(st.margin).toFixed(2) + ' m - it goes over ' + st.dir +
        '. Add a set of legs at that end.']);
    } else if (st.margin < 0.4) {
      f.push(['warn', 'Only ' + st.margin.toFixed(2) + ' m of stance margin ' +
        st.dir + '. A long hull wants a second set of legs toward that end.']);
    }
  }
  /* An empty tool mount is the whole point of the class hull going unused,
   * so name it by family rather than leaving the ship silently useless. */
  const EMPTY = { Drill: ['no drill fitted - it cannot mine', 'Drill'],
                  Sensor: ['no sensor fitted - it cannot scan', 'Sensor'],
                  Cargo: ['no handling gear fitted', 'Cargo'],
                  Fluid: ['no transfer gear fitted', 'Fluid'] };
  const taken = new Set();
  ship.forEach(i => { if (i.parent >= 0) taken.add(i.parent + ':' + i.node); });
  const openKinds = {};
  ship.forEach((inst, i) => {
    PARTS[inst.part].nodes.forEach((n, ni) => {
      if (ni === 0 && inst.parent >= 0) return;
      if (taken.has(i + ':' + ni)) return;
      if (EMPTY[n.kind]) openKinds[n.kind] = (openKinds[n.kind] || 0) + 1;
    });
  });
  Object.keys(openKinds).forEach(k => {
    const fitted = ship.some(i => PARTS[i.part].nodes[0].kind === k && i.parent >= 0);
    if (!fitted) f.push(['warn', 'This hull has ' + openKinds[k] + ' ' + EMPTY[k][1] +
        ' mount' + (openKinds[k] > 1 ? 's' : '') + ' and ' + EMPTY[k][0] + '.']);
  });
  if (ship.length >= CFG.maxParts) f.push(['warn', 'At the ' + CFG.maxParts + '-part limit.']);
  if (!f.length) f.push(['ok', 'Flightworthy. No faults.']);
  return f;
}

/* Baked atlases, one per part, embedded as data URIs by
 * tools/gen-ship-parts.py. Analytically unwrapped (see tools/shipuv.py). */
const TEXCACHE = {};
function texFor(id) {
  if (TEXCACHE[id] !== undefined) return TEXCACHE[id];
  const raw = PARTS[id] && PARTS[id].tex;
  if (!raw) { TEXCACHE[id] = null; return null; }
  const img = new Image();
  const t = new THREE.Texture(img);
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.anisotropy = 4;
  img.onload = () => { t.needsUpdate = true; };
  img.src = raw;
  TEXCACHE[id] = t;
  return t;
}

grid.position.y = -3.2;
scene.add(grid);

const shipGroup = new THREE.Group();

scene.add(shipGroup, nodeGroup);

let cam = { yaw: 0.85, pitch: 0.28, dist: 13, target: new THREE.Vector3(0, 0, -0.6) };
function placeCamera() {
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  camera.position.set(
    cam.target.x + cam.dist * cp * Math.sin(cam.yaw),
    cam.target.y + cam.dist * sp,
    cam.target.z + cam.dist * cp * Math.cos(cam.yaw));
  camera.lookAt(cam.target);
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* Bake each instance into its own world-space mesh: one mesh per part
 * keeps picking simple, and baking sidesteps mirrored-scale normal flips. */
function buildMeshes(poses) {
  while (shipGroup.children.length) {
    const m = shipGroup.children.pop();
    m.geometry.dispose();
    m.material.dispose();
  }
  ship.forEach((inst, i) => {
    const def = defOf(inst), t = poses[i];
    if (!t) return;
    const pos = [], col = [], uv = [];
    const wv = def.mesh.v.map(v => V(v).applyQuaternion(t.quat).add(t.pos));
    const tx = texFor(inst.part);
    /* The atlas already carries each material's colour, so vertex colour is
     * pure tint: white normally, amber for the selection, dimmed for the
     * rest of the ship while something is selected. */
    const dim = (selected >= 0 && selected !== i);
    /* Emissive faces (engine exhaust, running lights) go into a SECOND
     * buffer drawn unlit at full brightness. Shaded like the hull they
     * resolved to a dark disc at the back of the ship - an engine bell has
     * to read as lit from inside, and no lambert term will do that. */
    const ePos = [], eCol = [], eUv = [];
    def.mesh.f.forEach(f => {
      const lit = EMISSIVE.has(String(f[6]).toLowerCase());
      let c = new THREE.Color(0xffffff);
      if (tx === null || lit) c = new THREE.Color(f[6]);
      if (dim) c.multiplyScalar(0.55);
      else if (selected === i && !lit) c.lerp(new THREE.Color(0xffc266), 0.45);
      const P = lit ? ePos : pos, C = lit ? eCol : col, U = lit ? eUv : uv;
      for (let k = 0; k < 3; k++) {
        const v = wv[f[k]];
        P.push(v.x, v.y, v.z);
        C.push(c.r, c.g, c.b);
        const t2 = def.mesh.t[f[3 + k]];
        U.push(t2 ? t2[0] : 0, t2 ? t2[1] : 0);
      }
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.computeVertexNormals();
    const mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({
      map: tx || null, vertexColors: true, flatShading: true, side: THREE.FrontSide
    }));
    mesh.userData.inst = i;
    shipGroup.add(mesh);
    if (ePos.length) {
      const eg = new THREE.BufferGeometry();
      eg.setAttribute('position', new THREE.Float32BufferAttribute(ePos, 3));
      eg.setAttribute('color', new THREE.Float32BufferAttribute(eCol, 3));
      eg.setAttribute('uv', new THREE.Float32BufferAttribute(eUv, 2));
      const em = new THREE.Mesh(eg, new THREE.MeshBasicMaterial({
        vertexColors: true, side: THREE.DoubleSide
      }));
      em.userData.inst = i;
      shipGroup.add(em);
    }
  });
}

/* One colour per mount family, so a Drill node never reads as a Stack. */
const MOUNT_COLOR = {
  Stack: 0xd99a3c, Radial: 0xd99a3c, Hardpoint: 0x4dc9d6,
  Drill: 0xe0653c, Sensor: 0x5fbf7d, Cargo: 0xd9c23c, Fluid: 0x9a7bd9
};
let nodeHandles = [];
function buildNodes(free) {
  while (nodeGroup.children.length) {
    const m = nodeGroup.children.pop();
    m.geometry.dispose(); m.material.dispose();
  }
  nodeHandles = [];
  if (!held) return;
  /* Only light up mounts this part actually fits, so an exclusive tool
   * mount reads as "nothing else goes here" rather than as a mount the
   * click silently refuses. */
  const childKind = PARTS[held].nodes[0].kind;
  free = free.filter(f => mates(f.kind, childKind));
  free.forEach(f => {
    const g = new THREE.SphereGeometry(0.19, 12, 8);
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      color: MOUNT_COLOR[f.kind] || 0xd99a3c,
      transparent: true, opacity: 0.9
    }));
    m.position.copy(f.pos);
    m.userData.free = f;
    nodeGroup.add(m);
    nodeHandles.push(m);
  });
}

/* ---------------- picking ---------------- */
const ray = new THREE.Raycaster();
function pick(ev, objs) {
  const r = canvas.getBoundingClientRect();
  const p = new THREE.Vector2(
    ((ev.clientX - r.left) / r.width) * 2 - 1,
    -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(p, camera);
  return ray.intersectObjects(objs, false);
}

let drag = null, moved = 0;
canvas.addEventListener('pointerdown', ev => {
  drag = { x: ev.clientX, y: ev.clientY }; moved = 0;
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  moved += Math.abs(dx) + Math.abs(dy);
  cam.yaw -= dx * 0.008;
  cam.pitch = Math.max(-1.35, Math.min(1.35, cam.pitch + dy * 0.006));
  drag = { x: ev.clientX, y: ev.clientY };
  placeCamera();
});
canvas.addEventListener('pointerup', ev => {
  const wasDrag = moved > 6;
  drag = null;
  if (wasDrag) return;
  if (held) {
    const hit = pick(ev, nodeHandles);
    if (hit.length) {
      const f = hit[0].object.userData.free;
      attach(f.inst, f.node, held);
      held = null;
      renderCatalogue();
      return;
    }
  }
  const hit = pick(ev, shipGroup.children);
  selected = hit.length ? hit[0].object.userData.inst : -1;
  rebuild();
});
canvas.addEventListener('wheel', ev => {
  ev.preventDefault();
  cam.dist = Math.max(5, Math.min(48, cam.dist * (1 + Math.sign(ev.deltaY) * 0.12)));
  placeCamera();
}, { passive: false });

/* ---------------- UI ---------------- */
function iconFor(def, size) {
  /* Draw the part's own geometry into the catalogue swatch - same source
   * as the model, so the catalogue can never show something the bay does
   * not build. */
  const c = document.createElement('canvas');
  const S = size * (devicePixelRatio > 1 ? 2 : 1);
  c.width = S; c.height = S;
  c.style.width = size + 'px'; c.style.height = size + 'px';
  const ctx = c.getContext('2d');
  const box = new THREE.Box3();
  def.mesh.v.forEach(v => box.expandByPoint(V(v)));
  const ctr = box.getCenter(new THREE.Vector3());
  const rad = Math.max(box.getSize(new THREE.Vector3()).length() * 0.5, 0.01);
  const yaw = 0.7, pitch = 0.34, dist = rad * 3.0;
  const eye = new THREE.Vector3(
    ctr.x + dist * Math.cos(pitch) * Math.sin(yaw),
    ctr.y + dist * Math.sin(pitch),
    ctr.z + dist * Math.cos(pitch) * Math.cos(yaw));
  const fwd = ctr.clone().sub(eye).normalize();
  const right = new THREE.Vector3(fwd.z, 0, -fwd.x).normalize();
  const up = new THREE.Vector3().crossVectors(fwd, right).normalize();
  const fl = 1.5 * S * 0.5;
  const proj = v => {
    const d = v.clone().sub(eye);
    const z = d.dot(fwd);
    if (z <= 1e-4) return null;
    return [S * 0.5 + fl * d.dot(right) / z, S * 0.5 - fl * d.dot(up) / z, z];
  };
  const light = new THREE.Vector3(-0.45, 0.8, 0.4).normalize();
  const tris = [];
  def.mesh.f.forEach(f => {
    const a = V(def.mesh.v[f[0]]), b = V(def.mesh.v[f[1]]), cc = V(def.mesh.v[f[2]]);
    const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(cc, a)).normalize();
    const P = [proj(a), proj(b), proj(cc)];
    if (P.some(p => !p)) return;
    const shade = 0.55 + 0.45 * (0.5 + 0.5 * Math.max(-1, Math.min(1, n.y)));
    const k = Math.max(0, n.dot(light));
    tris.push({ P, z: (P[0][2] + P[1][2] + P[2][2]) / 3, l: Math.min(1, shade * (0.7 + 0.58 * k)), c: f[6] });
  });
  tris.sort((p, q) => q.z - p.z);
  tris.forEach(t => {
    const col = new THREE.Color(t.c).multiplyScalar(t.l);
    ctx.fillStyle = '#' + col.getHexString();
    ctx.beginPath();
    ctx.moveTo(t.P[0][0], t.P[0][1]);
    ctx.lineTo(t.P[1][0], t.P[1][1]);
    ctx.lineTo(t.P[2][0], t.P[2][1]);
    ctx.closePath();
    ctx.fill();
  });
  return c;
}

let loadedShip = -1;

                  '<span class="st">' + f.graph.length + 'p · ' + f.twr + ' twr</span>';

}

const catEl = document.getElementById('cat');
function renderCatalogue() {
  catEl.textContent = '';
  PARTS_RAW.forEach(p => {
    const b = document.createElement('button');
    b.className = 'part' + (held === p.id ? ' held' : '');
    b.appendChild(iconFor(p, 34));
    const box = document.createElement('div');
    const nm = document.createElement('div');
    nm.className = 'nm'; nm.textContent = p.label;
    const rl = document.createElement('div');
    rl.className = 'rl';
    rl.textContent = p.role.toUpperCase() + ' · ' + p.mass_kg + ' kg';
    box.append(nm, rl);
    b.appendChild(box);
    b.title = p.blurb + '  [' + p.tier + ': ' + p.recipe + ']';
    b.onclick = () => { held = held === p.id ? null : p.id; renderCatalogue(); rebuild(); };
    catEl.appendChild(b);
  });
  document.getElementById('catNote').textContent = held
    ? 'Now click a glowing node on the ship.'
    : 'Pick a part, then click a node in the bay. Amber nodes stack and mount; cyan nodes are wing hardpoints.';
  document.getElementById('hint').innerHTML = held
    ? 'Holding <b>' + PARTS[held].label + '</b> &mdash; click a glowing node to attach it.'
    : (selected > 0
        ? 'Selected <b>' + PARTS[ship[selected].part].label + '</b>. Use the panel to roll or remove it.'
        : 'Pick a part on the left to start building. <b>' + ship.length + '/' + CFG.maxParts + '</b> parts.');
}

function fmt(n, d) { return n.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); }

function renderReadout(s) {
  const twrEl = document.getElementById('fTwr');
  twrEl.innerHTML = s.twr > 0 ? fmt(s.twr, 2) : '&mdash;';
  twrEl.className = 'v ' + (s.twr >= 1 ? 'ok' : s.twr > 0 ? 'bad' : '');
  document.getElementById('fCruise').innerHTML = s.cruise > 0
    ? Math.round(s.cruise) + ' <small>m/s</small>' : '&mdash;';

  const rows = [
    ['Parts', ship.length + ' / ' + CFG.maxParts, ''],
    ['Mass', fmt(s.mass, 0) + ' <small>kg</small>', ''],
    ['Thrust', fmt(s.thrust / 1000, 1) + ' <small>kN</small>', 'eng'],
    ['Accel at full', fmt(s.aMax, 1) + ' <small>m/s²</small>', 'eng'],
    ['Stop time (90%)', fmt(s.t90, 1) + ' <small>s</small>', ''],
    ['Turn rate', fmt(s.turn, 2) + ' <small>rad/s</small>',
      s.turn < 0.15 ? 'warn' : s.turn > 1.0 ? 'good' : ''],
    ['Pitch inertia', fmt(s.I, 0) + ' <small>kg·m²</small>', ''],
    ['Control torque', fmt(s.torque / 1000, 1) + ' <small>kN·m</small>', ''],
    ['Fuel', fmt(s.fuelCap, 0) + ' <small>units</small>', ''],
    ['Burn time', s.burn > 0 ? fmt(s.fuelCap / s.burn, 0) + ' <small>s</small>' : '—', ''],
    ['Cargo slots', String(s.cargo), ''],
    ['Lift area', fmt(s.lift, 1) + ' <small>m²</small>', ''],
    ['Docking', s.hasDock ? 'fitted' : 'none', s.hasDock ? 'good' : 'warn']
  ];
  /* Class output only appears when the ship actually carries the gear -
   * a fighter has no business showing an empty "mining rate" row. */
  if (s.mineRate > 0) rows.push(['Mining rate', fmt(s.mineRate, 1) + ' <small>m³/s</small>', 'good']);
  if (s.scanRange > 0) rows.push(['Scan range', fmt(s.scanRange, 0) + ' <small>m</small>', 'good']);
  if (s.loadRate > 0) rows.push(['Load rate', fmt(s.loadRate, 1) + ' <small>t/s</small>', 'good']);
  if (s.pumpRate > 0) rows.push(['Transfer rate', fmt(s.pumpRate, 0) + ' <small>L/s</small>', 'good']);
  if (s.hasGear > 0) {
    const st = s.stance;
    rows.push(['Stance margin',
      st.degenerate ? 'no base' : fmt(st.margin, 2) + ' <small>m</small>',
      (st.degenerate || st.margin <= 0) ? 'warn' : st.margin < 0.4 ? 'warn' : 'good']);
  }
  const host = document.getElementById('rows');
  host.textContent = '';
  rows.forEach(([k, v, cls]) => {
    const d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<span class="k">' + k + '</span><span class="v ' + cls + '">' + v + '</span>';
    host.appendChild(d);
  });

  const fh = document.getElementById('faults');
  fh.textContent = '';
  faultsOf(s).forEach(([kind, msg]) => {
    const d = document.createElement('div');
    d.className = 'fault ' + (kind === 'bad' ? '' : kind);
    d.textContent = msg;
    fh.appendChild(d);
  });

  const sw = document.getElementById('selWrap');
  sw.textContent = '';
  if (selected > 0) {
    const def = PARTS[ship[selected].part];
    const box = document.createElement('div');
    box.className = 'sel';
    box.innerHTML = '<div class="sect-head" style="padding:0 0 4px">Selected</div>' +
      '<h4>' + def.label + '</h4><p>' + def.blurb + '</p>';
    const btns = document.createElement('div');
    btns.className = 'btns';
    const r = document.createElement('button');
    r.textContent = 'Roll 90°';
    r.onclick = () => { ship[selected].roll = (ship[selected].roll + 1) % 4; rebuild(); };
    const d = document.createElement('button');
    d.textContent = 'Remove';
    d.onclick = () => removeAt(selected);
    btns.append(r, d);
    box.appendChild(btns);
    sw.appendChild(box);
  }

  /* The plan's flat comma-list pad encoding (section 4.5) - three ints per
   * node, no nested separators, so it survives block_entity's record parser. */
  const ids = PARTS_RAW.map(p => p.id);
  const enc = ship.map(i => [ids.indexOf(i.part) + 163,
                             i.parent < 0 ? 255 : i.parent,
                             (i.node & 31) | (i.roll << 5)].join(',')).join(', ');
  document.getElementById('exportBox').textContent = ':m:8,' + ship.length + ', ' + enc;
}

function rebuild() {
  const poses = solve();
  buildMeshes(poses);
  buildNodes(freeNodes(poses));
  renderReadout(analyse(poses));
  renderCatalogue();
  renderFleet();
}

document.getElementById('symBtn').onclick = (e) => {
  symmetry = !symmetry;
  e.currentTarget.classList.toggle('on', symmetry);
};
document.getElementById('clearBtn').onclick = () => { starter(); held = null; loadedShip = -1; rebuild(); };

/* ---------------- persistence (optional capability) ---------------- */
let DB = null;
const savedWrap = document.getElementById('savedWrap');

function renderSaved(docs) {
  savedWrap.textContent = '';
  if (!DB) return;
  const h = document.createElement('div');
  h.className = 'sect-head';
  h.textContent = 'Saved designs';
  savedWrap.appendChild(h);
  const list = document.createElement('div');
  list.className = 'saved';
  if (!docs.length) {
    const n = document.createElement('div');
    n.className = 'note';
    n.style.padding = '0';
    n.textContent = 'Nothing saved yet. Build a ship and hit Save design - Claude can read these back to build the real part stats from what you actually flew.';
    list.appendChild(n);
  }
  docs.forEach(d => {
    const b = document.createElement('button');
    b.innerHTML = '<span>' + (d.name || 'untitled') + '</span><em>' +
      (d.parts || 0) + 'p · ' + (d.twr || '?') + ' twr</em>';
    b.onclick = () => {
      if (Array.isArray(d.graph)) { ship = d.graph.map(g => ({ twin: -1, ...g })); selected = -1; rebuild(); }
    };
    list.appendChild(b);
  });
  savedWrap.appendChild(list);
}

(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!db) return;                       // design for absence - page works alone
  DB = db;
  document.getElementById('saveBtn').hidden = false;
  const refresh = async () => {
    try {
      const snap = await DB.collection('designs').orderBy('savedAt', 'desc').limit(12).get();
      renderSaved(snap.docs.map(d => d.data()));
    } catch (e) { renderSaved([]); }
  };
  document.getElementById('saveBtn').onclick = async () => {
    const s = analyse(solve());
    const name = prompt('Name this design', 'Ship ' + new Date().toISOString().slice(5, 16));
    if (!name) return;
    try {
      await DB.collection('designs').add({
        name, graph: ship, parts: ship.length,
        twr: Number(s.twr.toFixed(2)), mass: Math.round(s.mass),
        thrust_kn: Number((s.thrust / 1000).toFixed(1)),
        cruise_mps: Math.round(s.cruise), savedAt: new Date().toISOString()
      });
      refresh();
    } catch (e) { alert('Could not save: ' + (e && e.message ? e.message : e)); }
  };
  refresh();
})();

/* ---------------- go ---------------- */
starter();
resize();
placeCamera();
rebuild();
(function loop() {
  requestAnimationFrame(loop);
  renderer.render(scene, camera);
})();
</script>
