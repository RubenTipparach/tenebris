<title>Tenebris Hex Structure Editor</title>
<style>
  :root {
    --space: #0b0c12;
    --panel: #171923;
    --panel-2: #1f2230;
    --line: #2c3042;
    --text: #d9dce6;
    --dim: #8b90a3;
    --cyan: #52e2ff;
    --pink: #ff5ec8;
    --gold: #d9ac48;
    --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--space); color: var(--text);
    font-family: var(--mono); font-size: 13px;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  /* ---------- top bar ---------- */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; flex-direction: column; gap: 2px; margin-right: 6px; }
  .brand b {
    font-size: 13px; letter-spacing: .18em; font-weight: 700;
    color: var(--cyan); text-transform: uppercase; white-space: nowrap;
  }
  .brand span { font-size: 10px; letter-spacing: .08em; color: var(--dim); }
  .group { display: flex; align-items: center; gap: 6px; }
  .group .lbl { color: var(--dim); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  input[type=text] {
    background: var(--space); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 8px; font: inherit; width: 150px;
  }
  input[type=text]:focus { outline: none; border-color: var(--cyan); }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--cyan); color: var(--cyan); }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
  button.primary { border-color: var(--gold); color: var(--gold); }
  button.primary:hover { background: var(--gold); color: #1a1405; }
  button.tool.active { background: var(--cyan); border-color: var(--cyan); color: #06222b; }
  .layerbox { display: flex; align-items: center; gap: 4px; }
  .layerbox .num {
    min-width: 44px; text-align: center; background: var(--space);
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 4px;
    color: var(--cyan); font-variant-numeric: tabular-nums;
  }
  .spacer { flex: 1; }
  /* ---------- main ---------- */
  main { flex: 1; display: flex; min-height: 0; }
  /* palette rail */
  #palette {
    width: 148px; background: var(--panel); border-right: 1px solid var(--line);
    padding: 10px 8px; display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto; flex-shrink: 0;
  }
  #palette .lbl {
    color: var(--dim); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; margin: 2px 2px 4px;
  }
  .swatch {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    border: 1px solid transparent; border-radius: 5px; cursor: pointer;
  }
  .swatch:hover { background: var(--panel-2); }
  .swatch.sel { border-color: var(--cyan); background: var(--panel-2); }
  .swatch img {
    width: 28px; height: 28px; image-rendering: pixelated;
    border-radius: 3px; background: var(--space); flex-shrink: 0;
  }
  .swatch span { font-size: 11px; color: var(--text); }
  .swatch small { display: block; color: var(--dim); font-size: 9px; }
  /* canvas */
  #wrap { flex: 1; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  /* status strip */
  footer {
    display: flex; gap: 18px; align-items: center; padding: 5px 14px;
    background: var(--panel); border-top: 1px solid var(--line);
    color: var(--dim); font-size: 11px; flex-wrap: wrap;
  }
  footer b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  #saveState { color: var(--gold); }
  #toast {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--gold); color: var(--gold);
    padding: 8px 16px; border-radius: 6px; opacity: 0; pointer-events: none;
    transition: opacity .25s; max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  .hint { color: var(--dim); font-size: 10px; letter-spacing: .04em; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<header>
  <div class="brand">
    <b>Tenebris // Hex Structure Editor</b>
    <span>pointy-top axial grid &middot; 2 m hexes &middot; 1.25 m layers</span>
  </div>
  <div class="group">
    <span class="lbl">Template</span>
    <input type="text" id="tplName" value="my-structure" maxlength="48" spellcheck="false">
  </div>
  <div class="group layerbox">
    <span class="lbl">Layer</span>
    <button id="layerDn" title="[ key">&minus;</button>
    <span class="num" id="layerNum">0</span>
    <button id="layerUp" title="] key">+</button>
  </div>
  <div class="group">
    <button class="tool active" id="toolPaint" title="P — left-drag paints">Paint</button>
    <button class="tool" id="toolErase" title="E — or right-drag anytime">Erase</button>
    <button id="undoBtn" title="Ctrl+Z">Undo</button>
  </div>
  <div class="spacer"></div>
  <div class="group">
    <button id="importBtn">Import</button>
    <button id="copyBtn">Copy JSON</button>
    <button class="primary" id="exportBtn">Export .template.json</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</header>

<main>
  <nav id="palette" aria-label="Block palette">
    <div class="lbl">Structure</div>
  </nav>
  <div id="wrap"><canvas id="cv"></canvas></div>
</main>

<footer>
  <span>cell <b id="posOut">&ndash;</b></span>
  <span>cells placed <b id="countOut">0</b></span>
  <span>zoom <b id="zoomOut">100%</b></span>
  <span id="saveState">saved</span>
  <span class="hint">wheel: zoom &middot; middle/space-drag: pan &middot; right-drag: erase &middot; alt-click: pick &middot; [ ]: layer &middot; exports belong in tenebris-rs/assets/templates/</span>
</footer>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * Tile art: the actual baked PNGs from tools/gen-casino-textures.py,
 * so what you paint is what the station renders.
 * ------------------------------------------------------------------ */
const TILES = {
  hull:         { name: "Station Hull",  b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAaElEQVR42mOIScr5TwlmABHXbj36v2LdDgwMEickDzYAm+SkGYvANLI8TAwZMxBSQMgCuAHYNOMyAFktAyEFhCygTiCW1bThxITkGQZXOiA2GgnGAraEhDcWiIlGXK4kKyFhpMQBTQcAwl3LZ0vbfQMAAAAASUVORK5CYII=" },
  floor:        { name: "Station Floor", b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAQUlEQVR42mMIiUr5TwlmABFNXdP+55Q0wAVJ4YMNAHFsnLzgCkjhM1DFCxQZQK7fYXwGcv0O4w+CMBhNB8MhHQAAHkAfP3Q2/e4AAAAASUVORK5CYII=" },
  carpet:       { name: "Casino Carpet", b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAi0lEQVR42qWSsQ2AMAwEfwxKJmAACkTBCEzGFJQMwz5BLhxZL4P1okhhX+I4F+M+1zaPe1/XcrRp2Hrs3HPGnVkOcVNcBj3PRWJx8E0x/urEY/AhLpYViRzxTVknlRNUN1ROwFB1ggwqTsBQdQLVOjsB/6vqBNlwKE76HLx1Ujn5P4nVrFdOkEHFyQN2f+nod5E1YQAAAABJRU5ErkJggg==" },
  wall:         { name: "Casino Wall",   b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAARUlEQVR42mNQkzH6TwlmMNFw+U8JZriywuE/JZiBYi/AGCDnIEsQy6etATB/kmUATCOMTX8DKPYC/WJh4FMixZmJUhcAAJz5sPjh+YIHAAAAAElFTkSuQmCC" },
  neon:         { name: "Neon (cyan)",   b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAbElEQVR42mNQUtX5D8M6Bhb/kfnoGJs8Az6N+AyEyTEQqwmXOAOxzsdlGAOpfsbpAhCeNmcZXsXY5BlU8qb9pwQzBDz8/58SzADE/ynBlLuA4jCgOBbIiX+MhEROJiKYEolJhSA1DKRqQBcDAB027vb/5j7oAAAAAElFTkSuQmCC" },
  neon_pink:    { name: "Neon (pink)",   b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAbklEQVR42mNQUtX5D8M6Bhb/kfnoGJs8Az6N+AyEyTEQqwmXOAOxzsdlGAOpfsbpAhCeNmcZXsXY5BmmaeT9pwQz/A848Z8SzPD/4a//lGDKXUBxGFAcC+TEP0ZCIicTEUyJxKRCkBoGUjWgiwEAtYzsBkNeNN0AAAAASUVORK5CYII=" },
  neon_gold:    { name: "Neon (gold)",   b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAbklEQVR42mNQUtX5D8M6Bhb/kfnoGJs8Az6N+AyEyTEQqwmXOAOxzsdlGAOpfsbpAhCeNmcZXsXY5BmmZcr9pwQz/N/n9p8SzPD/w9n/lGDKXUBxGFAcC+TEP0ZCIicTEUyJxKRCkBoGUjWgiwEA5+jlxjqoRkoAAAAASUVORK5CYII=" },
  sign:         { name: "Casino Sign",   b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAXUlEQVR42mP4fyPlf0WMyn9yaQYQIcAnQhYGGcIAIsg1gDYuqNDI+/8/4Q5WDJIjywUwQ8kKA5hmdNuJcgE+zUS5AJ9mgi7A5W+iXUDIdoIuIGT7IE6JZLmAkiwNAPkZqF8r0K8VAAAAAElFTkSuQmCC" },
  glass:        { name: "Station Glass", b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAX0lEQVR42mOYNm/Nf0owA4h4+PX/iWln/y/FwDCFWOQyp13aBzcAJIDVEFIMwGoIqQZgGEKOASiGkGsA3BCiDaA0GkdQOkCWJzsdwOQpSgcgeRQDQBxsGGYAPnmKoxEAsNvzCw3PDDUAAAAASUVORK5CYII=" },
  slot_machine: { name: "Slot Machine",  b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAYElEQVR42mO4ssLhPyWYAUSc0LD4/yElD0wjY0JiKAaQg+EGUOQFBRWb/5RguAGvX3+AY2L4WA04K6eLogEfnzYGUOQFigORbANokg5snLywYpK9ALOFtmEgIqbynxIMADDzHEnf0gPMAAAAAElFTkSuQmCC" },
  card_table:   { name: "Card Table",    b64: "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAj0lEQVR42mO4ssLhPyWYAURo5DmhYIUYMwwxbOIoBhCrCVmcJBdgE8Mw4PXrDyiYZC+ANMnJKeE0gCwX4HMVTgNgroCJnZXTRTEA5hWsXsDlApgheF2ALaBI8gK2qMJmAFYvgJwIw7gSD7pFGAbA/IpNk1XMMTjG6gVkF+AyAGQBTgPQnY3OR3cBSl6gBAMAlLZYvXAMFAIAAAAASUVORK5CYII=" },
};
TILES.neon_pink.b64 = "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAbklEQVR42mNQUtX5D8M6Bhb/kfnoGJs8Az6N+AyEyTEQqwmXOAOxzsdlGAOpfsbpAhCeNmcZXsXY5BmmaeT9pwQz/A848Z8SzPD/4a//lGDKXUBxGFAcC+TEP0ZCIicTEUyJxKRCkBoGUjWgiwEAtYzsBkNeNN0AAAAASUVORK5CYII=";
TILES.neon_gold.b64 = "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAbklEQVR42mNQUtX5D8M6Bhb/kfnoGJs8Az6N+AyEyTEQqwmXOAOxzsdlGAOpfsbpAhCeNmcZXsXY5BmmZcr9pwQz/N/n9p8SzPD/w9n/lGDKXUBxGFAcC+TEP0ZCIicTEUyJxKRCkBoGUjWgiwEA5+jlxjqoRkoAAAAASUVORK5CYII=";

const MATS = Object.keys(TILES);
const IMG = {};
for (const m of MATS) {
  const img = new Image();
  img.src = "data:image/png;base64," + TILES[m].b64;
  img.onload = () => draw();
  IMG[m] = img;
}

/* ------------------------------------------------------------------ *
 * Model. Cells keyed "q,r,layer" -> mat. Same axial layout as
 * core/station.rs: x = sqrt(3)*a*(q + r/2), y = 1.5*a*r (pointy-top).
 * ------------------------------------------------------------------ */
const HEX = 24;            /* base px circumradius at zoom 1 */
const SQ3 = Math.sqrt(3);
const LS_KEY = "tenebris-hex-editor-v1";
const MAX_LAYER = 40;

let cells = new Map();
let layer = 0, mat = "hull", tool = "paint";
let cam = { x: 0, y: 0, z: 1 };
let hover = null;
let undoStack = [];        /* [{key, prev, next}, ...] batches per stroke */
let strokeBatch = null;

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const wrap = document.getElementById("wrap");

function key(q, r, l) { return q + "," + r + "," + l; }
function axialToPx(q, r) { return { x: SQ3 * HEX * (q + r / 2), y: 1.5 * HEX * r }; }
function pxToAxial(x, y) {
  const qf = (SQ3 / 3 * x - y / 3) / HEX, rf = (2 / 3 * y) / HEX, sf = -qf - rf;
  let q = Math.round(qf), r = Math.round(rf), s = Math.round(sf);
  const dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s - sf);
  if (dq > dr && dq > ds) q = -r - s; else if (dr > ds) r = -q - s;
  return { q, r };
}
function hexPath(c, x, y, rad) {
  c.beginPath();
  for (let k = 0; k < 6; k++) {
    const th = Math.PI / 6 + k * Math.PI / 3;
    const px = x + rad * Math.cos(th), py = y + rad * Math.sin(th);
    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0b0c12";
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.translate(w / 2 + cam.x, h / 2 + cam.y);
  ctx.scale(cam.z, cam.z);
  ctx.imageSmoothingEnabled = false;

  /* Visible axial range (loose bound). */
  const halfW = w / 2 / cam.z + 2 * HEX, halfH = h / 2 / cam.z + 2 * HEX;
  const cx = -cam.x / cam.z, cy = -cam.y / cam.z;
  const rMin = Math.floor((cy - halfH) / (1.5 * HEX)), rMax = Math.ceil((cy + halfH) / (1.5 * HEX));
  const s = HEX - 0.5;

  for (let r = rMin; r <= rMax; r++) {
    const qMin = Math.floor((cx - halfW) / (SQ3 * HEX) - r / 2), qMax = Math.ceil((cx + halfW) / (SQ3 * HEX) - r / 2);
    for (let q = qMin; q <= qMax; q++) {
      const p = axialToPx(q, r);
      /* faint lattice */
      hexPath(ctx, p.x, p.y, s);
      ctx.strokeStyle = "rgba(44,48,66,.55)";
      ctx.lineWidth = 1 / cam.z;
      ctx.stroke();
      /* ghost: layer below */
      const below = cells.get(key(q, r, layer - 1));
      if (below) {
        ctx.save(); hexPath(ctx, p.x, p.y, s); ctx.clip();
        ctx.globalAlpha = 0.22;
        ctx.drawImage(IMG[below], p.x - HEX, p.y - HEX, HEX * 2, HEX * 2);
        ctx.restore();
      }
      /* current layer cell */
      const m = cells.get(key(q, r, layer));
      if (m) {
        ctx.save(); hexPath(ctx, p.x, p.y, s); ctx.clip();
        ctx.drawImage(IMG[m], p.x - HEX, p.y - HEX, HEX * 2, HEX * 2);
        ctx.restore();
        hexPath(ctx, p.x, p.y, s);
        ctx.strokeStyle = "rgba(217,220,230,.28)";
        ctx.stroke();
      }
      /* marker above: outline if a cell exists on layer+1 */
      if (cells.get(key(q, r, layer + 1))) {
        hexPath(ctx, p.x, p.y, s * 0.45);
        ctx.strokeStyle = "rgba(255,94,200,.5)";
        ctx.setLineDash([3 / cam.z, 3 / cam.z]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
  /* origin marker + hover */
  const o = axialToPx(0, 0);
  hexPath(ctx, o.x, o.y, s); ctx.strokeStyle = "rgba(217,172,72,.6)"; ctx.stroke();
  if (hover) {
    const p = axialToPx(hover.q, hover.r);
    hexPath(ctx, p.x, p.y, s);
    ctx.strokeStyle = tool === "erase" ? "#ff5e5e" : "#52e2ff";
    ctx.lineWidth = 2 / cam.z;
    ctx.stroke();
  }
  ctx.restore();
}

/* ------------------------------------------------------------------ *
 * Editing + undo
 * ------------------------------------------------------------------ */
function setCell(q, r, l, m) {
  const k = key(q, r, l), prev = cells.get(k) ?? null;
  const next = m ?? null;
  if (prev === next) return;
  if (strokeBatch) strokeBatch.push({ k, prev });
  if (next) cells.set(k, next); else cells.delete(k);
  dirty();
}
function undo() {
  const batch = undoStack.pop();
  if (!batch) return;
  for (const { k, prev } of batch) { if (prev) cells.set(k, prev); else cells.delete(k); }
  dirty();
  toast("undone");
}

/* ------------------------------------------------------------------ *
 * Persistence: everything lives in localStorage; export goes to git
 * under tenebris-rs/assets/templates/.
 * ------------------------------------------------------------------ */
let saveTimer = null;
function dirty() {
  document.getElementById("countOut").textContent = cells.size;
  document.getElementById("saveState").textContent = "saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLocal, 300);
  draw();
}
function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      name: document.getElementById("tplName").value,
      layer, cam, cells: [...cells.entries()],
    }));
    document.getElementById("saveState").textContent = "saved to localStorage";
  } catch (e) {
    document.getElementById("saveState").textContent = "localStorage full!";
  }
}
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (!d) return;
    document.getElementById("tplName").value = d.name || "my-structure";
    layer = d.layer | 0; cam = d.cam || cam;
    cells = new Map(d.cells || []);
  } catch (e) { /* fresh start */ }
}
function templateJson() {
  const cellArr = [...cells.entries()].map(([k, m]) => {
    const [q, r, l] = k.split(",").map(Number);
    return { q, r, layer: l, mat: m };
  }).sort((a, b) => a.layer - b.layer || a.r - b.r || a.q - b.q);
  return JSON.stringify({
    format: "tenebris-station-template",
    version: 1,
    name: document.getElementById("tplName").value || "my-structure",
    hex_size_m: 2.0,
    layer_height_m: 1.25,
    cells: cellArr,
  }, null, 2);
}
function importJson(text) {
  const d = JSON.parse(text);
  if (d.format !== "tenebris-station-template") throw new Error("not a station template");
  cells = new Map(d.cells.map(c => [key(c.q, c.r, c.layer), c.mat]));
  document.getElementById("tplName").value = d.name || "imported";
  undoStack = [];
  dirty();
  toast("imported " + d.cells.length + " cells");
}

/* ------------------------------------------------------------------ *
 * UI wiring
 * ------------------------------------------------------------------ */
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
function setLayer(l) {
  layer = Math.max(0, Math.min(MAX_LAYER, l));
  document.getElementById("layerNum").textContent = layer;
  dirty();
}
function setTool(t) {
  tool = t;
  document.getElementById("toolPaint").classList.toggle("active", t === "paint");
  document.getElementById("toolErase").classList.toggle("active", t === "erase");
  draw();
}

/* palette */
const pal = document.getElementById("palette");
for (const m of MATS) {
  const el = document.createElement("div");
  el.className = "swatch" + (m === mat ? " sel" : "");
  el.dataset.mat = m;
  el.innerHTML = `<img alt="" src="data:image/png;base64,${TILES[m].b64}"><span>${TILES[m].name}<small>${m}</small></span>`;
  el.onclick = () => {
    mat = m; setTool("paint");
    pal.querySelectorAll(".swatch").forEach(x => x.classList.toggle("sel", x.dataset.mat === m));
  };
  pal.appendChild(el);
}

document.getElementById("layerUp").onclick = () => setLayer(layer + 1);
document.getElementById("layerDn").onclick = () => setLayer(layer - 1);
document.getElementById("toolPaint").onclick = () => setTool("paint");
document.getElementById("toolErase").onclick = () => setTool("erase");
document.getElementById("undoBtn").onclick = undo;
document.getElementById("tplName").oninput = dirty;

document.getElementById("exportBtn").onclick = () => {
  const name = (document.getElementById("tplName").value || "my-structure")
    .replace(/[^a-z0-9-_]/gi, "-").toLowerCase();
  const blob = new Blob([templateJson()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + ".template.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("exported - commit it to tenebris-rs/assets/templates/");
};
document.getElementById("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(templateJson()); toast("JSON copied"); }
  catch (e) { toast("copy blocked - use Export instead"); }
};
document.getElementById("importBtn").onclick = () => document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(importJson).catch(err => toast("import failed: " + err.message));
  e.target.value = "";
};

/* pointer input */
let panning = false, painting = false, erasing = false, spaceHeld = false, last = null;
function evAxial(e) {
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left - rect.width / 2 - cam.x) / cam.z;
  const y = (e.clientY - rect.top - rect.height / 2 - cam.y) / cam.z;
  return pxToAxial(x, y);
}
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  if (e.button === 1 || spaceHeld) { panning = true; last = { x: e.clientX, y: e.clientY }; return; }
  const { q, r } = evAxial(e);
  if (e.altKey) {
    const m = cells.get(key(q, r, layer));
    if (m) {
      mat = m; setTool("paint");
      pal.querySelectorAll(".swatch").forEach(x => x.classList.toggle("sel", x.dataset.mat === m));
      toast("picked " + TILES[m].name);
    }
    return;
  }
  strokeBatch = [];
  if (e.button === 2 || tool === "erase") { erasing = true; setCell(q, r, layer, null); }
  else { painting = true; setCell(q, r, layer, mat); }
});
cv.addEventListener("pointermove", e => {
  if (panning && last) {
    cam.x += e.clientX - last.x; cam.y += e.clientY - last.y;
    last = { x: e.clientX, y: e.clientY };
    draw(); return;
  }
  const a = evAxial(e);
  if (!hover || hover.q !== a.q || hover.r !== a.r) {
    hover = a;
    document.getElementById("posOut").textContent = `q ${a.q}  r ${a.r}  L${layer}`;
    if (painting) setCell(a.q, a.r, layer, mat);
    else if (erasing) setCell(a.q, a.r, layer, null);
    else draw();
  }
});
window.addEventListener("pointerup", () => {
  if (strokeBatch && strokeBatch.length) { undoStack.push(strokeBatch); if (undoStack.length > 200) undoStack.shift(); }
  strokeBatch = null;
  panning = painting = erasing = false; last = null;
  saveLocal();
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left - rect.width / 2, my = e.clientY - rect.top - rect.height / 2;
  const z0 = cam.z;
  cam.z = Math.max(0.2, Math.min(6, cam.z * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
  cam.x = mx - (mx - cam.x) * (cam.z / z0);
  cam.y = my - (my - cam.y) * (cam.z / z0);
  document.getElementById("zoomOut").textContent = Math.round(cam.z * 100) + "%";
  draw();
}, { passive: false });

window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { spaceHeld = true; e.preventDefault(); }
  else if (e.key === "[") setLayer(layer - 1);
  else if (e.key === "]") setLayer(layer + 1);
  else if (e.key === "p" || e.key === "P") setTool("paint");
  else if (e.key === "e" || e.key === "E") setTool("erase");
  else if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); undo(); }
});
window.addEventListener("keyup", e => { if (e.code === "Space") spaceHeld = false; });
new ResizeObserver(draw).observe(wrap);

/* boot */
loadLocal();
setLayer(layer);
setTool("paint");
document.getElementById("countOut").textContent = cells.size;
draw();
</script>
