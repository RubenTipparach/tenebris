<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tenebris (WASM Preview)</title>
  <style>
    html,body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; font-family:monospace; color:#ddd; }
    #canvas   { display:block; width:100%; height:100%; background:#000; outline:none; }
    #loading  { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:20px; }
    #loading.hidden { display:none; }
    #back     { position:fixed; top:8px; left:8px; color:#aaa; text-decoration:none; font-size:12px; opacity:0.6; }
    #back:hover { opacity:1; }
  </style>
</head>
<body>
  <a id="back" href="../">&larr; back to chooser</a>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="loading">loading WASM...</div>

  <!-- Eruda devtools - mobile-only. Phones don't have a built-in
       console panel, so any printf from the WASM is invisible. Eruda
       drops a floating button in the corner that opens a Chrome-style
       devtools panel right on the page. Disabled on desktop where
       browser devtools is already there.

       Detection mirrors the C-side tenebris_is_mobile_device check
       (UA regex). Loaded from a CDN; if the CDN is unreachable the
       game still boots normally, you just won't have the panel. -->
  <script type="text/javascript">
    (function() {
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (!isMobile) return;
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/eruda';
      s.onload = function() { try { eruda.init(); } catch (e) {} };
      document.head.appendChild(s);
    })();
  </script>

  <script type="text/javascript">
    var Module = {
      canvas: (function(){ return document.getElementById('canvas'); })(),
      onRuntimeInitialized: function(){
        var l = document.getElementById('loading');
        if (l) l.classList.add('hidden');
      },
      print:    function(t){ console.log(t); },
      printErr: function(t){ console.error(t); },
    };
  </script>
  <!-- The C build lets emcc inject {{{ SCRIPT }}} into this shell at
       link time (-o tenebris.html). The Rust build links to a plain
       .js (cargo's emscripten output), so the loader is referenced
       explicitly instead; build-web.* copies it (plus the .wasm and
       the --preload-file .data bundle) next to this page. -->
  <script async type="text/javascript" src="tenebris-client.js"></script>
</body>
</html>
