[package]
name = "tenebris-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# git rev pinned: crates.io 0.3.0 lacks the gl/debugtext/glue bindings
# the client UI layer needs (sokol_gl panels + sdtx labels per repo rules)
sokol = { git = "https://github.com/floooh/sokol-rust", rev = "9e3db76ac4d090d04cca4fc10cc8a1336452f44d" }
tenebris-core = { path = "../tenebris-core" }

# PNG decode for the renderer's runtime texture loads (atlas tiles,
# water normal map, flow-debug arrow). Stands in for the C tree's
# stb_image; assets stay the raw PNGs under tenebris-c/assets/textures.
png = "0.17"

# Client WebSocket transport (net_transport.rs). The C native client
# links the libwebsockets backend (net_transport_ws.c in client mode);
# the Rust port mirrors the server crate's tokio + tokio-tungstenite
# replacement.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Data-parallel terrain meshing. body_full_mesh builds each chunk's CPU
# mesh independently (reads &World, writes only its own HexMesh), so the
# per-chunk build fans out across a rayon work-stealing pool; the main
# (GL) thread keeps ownership of all sokol_gfx buffer uploads.
rayon = "1"
egui = "0.34.3"
# 2D plotting widget for the maneuver planner's orbit chart (self-contained
# egui window - replaces the old on-canvas overlay that fought the HUD).
egui_plot = "0.35"

[dev-dependencies]
