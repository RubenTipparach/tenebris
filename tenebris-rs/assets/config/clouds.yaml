# Puffy cloud layer - drawn on a shell above the surface, drifting with
# time. Parsed by core/clouds.rs (tiny key: value subset; color is a
# [r, g, b] list). Placement is a deterministic hash per shell cell, so
# the sky needs no saved state and every client sees the same clouds.
# The layer wraps the whole planet (each puff aligned to its surface
# normal) and stays visible from space; only puffs hidden behind the
# planet's horizon are culled.
#
# A field set to 0 / omitted keeps the compiled-in default; set density
# to a negative value to switch clouds off.
#
#   altitude_m   shell height above the planet surface (m)
#   cell_m       placement grid cell size (m); one puff max per cell
#   density      probability (0..1) a cell holds a puff (inside a
#                weather system; the patch field gates it elsewhere)
#   range_m      detail range (m): puffs inside get their full lump
#                cluster, farther ones LOD to a single slab
#   drift_mps    layer drift speed (m/s) about the spin axis
#   puff_w_m     base puff half-width (m); each puff hashes its own size
#   puff_h_m     base puff half-height / thickness (m)
#   color        daytime cloud albedo [r, g, b]
#   night_min    brightness floor on the night side (moonlit clouds)
#   patch_scale  weather-system noise frequency on the shell (higher =
#                smaller, more numerous systems)
#   patch_clear  fraction (0..1) of the coverage field held cloud-free;
#                negative = uniform sky (patchiness off)
#   patch_soft   edge softness of a system (coverage-field units)
#   lod_alt_m    camera altitude (m above surface) where the detailed
#                per-puff shell hands over to the far cloud-texture wrap.
#                Below this the puffs never distance-cull; above it a
#                single transparent cloud shell wraps the planet.
#   lod_fade_m   crossfade band (m) around lod_alt_m so the swap is smooth
#   shell_alpha  peak opacity (0..1) of the far cloud-texture shell
clouds:
  altitude_m: 60
  cell_m: 30
  density: 0.38
  range_m: 230
  drift_mps: 1.6
  puff_w_m: 9
  puff_h_m: 2.6
  color: [0.98, 0.98, 1.0]
  night_min: 0.32
  patch_scale: 4
  patch_clear: 0.45
  patch_soft: 0.18
  lod_alt_m: 5000
  lod_fade_m: 1500
  shell_alpha: 0.6
