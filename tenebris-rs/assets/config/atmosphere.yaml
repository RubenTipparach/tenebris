# Per-body atmosphere config.
#
# Loaded at boot by config_load_atmosphere() and applied to each
# matching body_config_t before the renderer reads it. Any field
# omitted falls back to the renderer default in main_web.c — set only
# what you want to override per planet.
#
# Sections are matched case-insensitively against body names (the
# `name` field in planet.c). Spaces in body names ("Asteroid A") get
# folded to underscores for the YAML key.
#
# Fields:
#   radius_mult         float  outer shell radius / planet radius
#   lower_radius_mult   float  atmosphere lower bound / planet radius
#                              (1.0 = atmosphere starts at the ground;
#                              >1.0 lifts the bottom up, thinning the
#                              shell; <1.0 sinks it under the surface.
#                              Also moves the planet-clip sphere used
#                              by the ray-march, so this is the knob
#                              for "how prominent is the limb halo".)
#   rayleigh_scale    float  main blue-sky knob, 1.0 = Earth
#   mie_scale         float  haze / forward sun-glow strength
#   sun_intensity     float  overall sky brightness multiplier
#   sunset_strength   float  warm-tint multiplier near horizon (0..1)
#   scale_height      float  density falloff in normalised altitude
#   mie_g             float  Mie phase asymmetry (-1..1)
#   wavelengths       vec3   (1/λ⁴) RGB ratios, RGB
#   sunset_tint       vec3   sky multiplier near horizon
#   sunset_glow       vec3   sun-direction glow at sunset
#   sunset_horizon    vec3   horizon-band tint at sunset
#   fog_color         vec3   TINT multiplier over the fog's base colour.
#                            The base is sampled from the Caelum sky at
#                            the horizon every frame (same scattering
#                            march as the atmosphere pass), so fog
#                            matches the sky by construction - day,
#                            night, and sunset included. Omit for the
#                            untinted sky match; on airless bodies with
#                            fog forced on this becomes the flat fog
#                            colour itself.
#   fog_density       float  fog per metre of view distance (composite
#                            pass, 1 - exp(-dist * density)); omit or 0
#                            for a crisp airless look
#   fog_height_m      float  camera altitude (m above sea level) where
#                            the fog has fully faded out - climb above
#                            the weather and the vista clears

tenebris:
  # Thin shell topping out at the OLD cloud deck height (72 m on the
  # 300 m planet - clouds now ride at 36 m, half that, so the deck
  # sits inside the atmosphere): playtest-tuned after 1.6 read like a
  # gas giant and 1.08 pinched the halo too tight.
  radius_mult: 1.24
  # Sink the planet-clip sphere slightly below the actual ground so
  # the atmosphere ray-march continues a bit past the visible horizon
  # — softens the harsh dark band where atmosphere meets the planet
  # silhouette in orbital views. Kept proportional to the thin shell.
  lower_radius_mult: 0.97
  # Aligned with Caelum's stated 'Tenebris default (scale-independent
  # with normalized steps)' values from src/atmosphere.c. Our shader
  # is now a faithful Caelum port (atmosphere.glsl), so the same
  # coefficients should produce the same look.
  # Raised from the Caelum default 9.0 - daytime sky read a touch
  # dark in playtests; 12 brightens the blue without blowing out the
  # tone map.
  sun_intensity: 12.0
  # Thin-shell compensation: with an 8% shell the vertical air column
  # is short, so the air fills the shell more uniformly (scale_height
  # up) and scatters a touch harder - keeps the zenith blue instead of
  # letting stars bleed through at noon.
  rayleigh_scale: 0.024
  mie_scale: 0.012
  mie_g: 0.85
  sunset_strength: 0.25
  scale_height: 0.6
  # Wavelengths + sunset vec3s are baked as literals in the new
  # Caelum-style atmosphere.glsl shader and ignored by the renderer
  # — kept here for back-compat in case we re-introduce per-body
  # tinting later.
  wavelengths: [5.602, 9.473, 19.644]
  sunset_tint: [1.3, 1.0, 0.6]
  sunset_glow: [1.0, 0.65, 0.25]
  sunset_horizon: [0.8, 0.4, 0.15]
  # Distance haze (halved from 0.012 in playtesting - ~26% at 50 m,
  # ~45% at 100 m); the colour is sampled from this body's own Caelum
  # sky at the horizon (no fog_color tint).
  fog_density: 0.006
  fog_height_m: 130.0

# Sequoia — sister Earth-like, slightly greener tint.
sequoia:
  sun_intensity: 15.0
  rayleigh_scale: 0.8
  sunset_tint: [1.1, 1.3, 0.7]
  sunset_glow: [0.9, 1.0, 0.45]
  # Sky-matched haze (Sequoia's greener sky comes out of its own
  # scattering params - no tint needed).
  fog_density: 0.006
  fog_height_m: 130.0

# Add other has_water=true bodies here. Bodies without atmosphere
# (moons, asteroids, icy planets) ignore this file entirely.
