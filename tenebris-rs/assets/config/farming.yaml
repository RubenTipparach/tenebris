# Farming tunables - crop growth + yields. Parsed by core/farming.rs
# (tiny key: value subset; a field set to 0 / omitted keeps the
# compiled-in default). See crates/tenebris-core/src/farming.rs.
#
# Berry bush (the original crop):
#   grow_time_s           seconds a planted seed takes to reach maturity
#   produce_yield         berries dropped when a mature crop is harvested
#   seed_yield            seeds returned per harvest (>= 1 keeps the loop
#                         self-sustaining)
#   grass_seed_chance     probability (0..1) a broken grass block drops a
#                         berry seed - the bootstrap for the whole loop
#   berry_hunger_restore  hunger points restored by eating one berry
#
# Wheat (slow; bakes into bread, the best plant food):
#   wheat_grow_time_s     seconds to maturity
#   wheat_yield           wheat per harvest
#   wheat_seed_yield      wheat seeds returned per harvest
#   wheat_seed_chance     grass-break chance band for wheat seeds
#                         (stacked after grass_seed_chance)
#   bread_hunger_restore  hunger restored by eating one bread
#
# Carrot (fast; the root is food AND its own seed - replant one to farm):
#   carrot_grow_time_s    seconds to maturity
#   carrot_yield          carrots per harvest
#   carrot_chance         grass-break chance band for a wild carrot
#                         (stacked after wheat_seed_chance)
#   carrot_hunger_restore hunger restored by eating one carrot
farming:
  grow_time_s: 45.0
  produce_yield: 3
  seed_yield: 2
  grass_seed_chance: 0.35
  berry_hunger_restore: 15.0
  wheat_grow_time_s: 70.0
  wheat_yield: 2
  wheat_seed_yield: 2
  wheat_seed_chance: 0.18
  bread_hunger_restore: 32.0
  carrot_grow_time_s: 35.0
  carrot_yield: 3
  carrot_chance: 0.08
  carrot_hunger_restore: 10.0
