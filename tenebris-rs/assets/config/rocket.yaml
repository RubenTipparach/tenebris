# rocket.yaml - rocket part stats + flight constants, parsed by
# core/rocket.rs. Ported from the JS RocketConfig
# (src/config/RocketConfig.ts), MEDIUM_* parts.
#
# Format (tiny subset): [section] headers + `key: value` floats, with
# `#` comments. Any omitted field keeps the compiled-in default in
# core/rocket.rs (DEFAULT_ROCKET_CONFIG), so partial overrides are fine.

# Atmospheric engine (item "rocket-engine"): high thrust, thirsty. The
# lift-off / lower-stage engine - build it at the bottom of the stack.
[engine]
thrust_n: 75000        # newtons at full throttle (TWR ~1.6 on the 1880 kg starter at 25 m/s2)
fuel_per_sec: 10       # fuel units burned per second at full throttle
mass_kg: 100

# Vacuum engine (item "vacuum-engine"): ~55% the thrust of the atmospheric
# engine but burns fuel far more efficiently (higher thrust per unit fuel).
# The upper-stage engine you stage to for the orbit burn once you shed the
# spent booster in space. Lighter, too (no atmospheric bell).
[engine_vacuum]
thrust_n: 30000
fuel_per_sec: 3
mass_kg: 80

[fuel_tank]
capacity: 100          # fuel units when full
wet_mass_kg: 500       # mass when full
dry_mass_kg: 50        # mass when empty

[command_module]
mass_kg: 200
parachute_alt_m: 50          # parachute deploys below this altitude
max_impact_mps: 10           # survivable landing speed
parachute_terminal_mps: 5    # descent speed once the chute is open

[flight]
gravity_mps2: 25       # matches the real surface gravity (planet::SURFACE_GRAVITY_MPS2_PER_G)
launch_alt_m: 5         # LAUNCHING -> IN_FLIGHT threshold altitude
safe_landing_mps: 2
drag_coef: 0.5
parachute_drag: 0.95
# Attitude authority, rad/s: how fast WASD pitches/yaws the ship. The mouse
# orbits the chase camera in rocket mode, so steering is all on the keys.
steer_rate_rads: 0.9
# Attitude autopilot (rotate-to-symbol / SAS-hold) PID gains. Kp turns the
# nose toward the picked navball direction, Kd damps the last few degrees so
# it settles instead of ringing, Ki trims residual (off by default - nothing
# biases a kinematic plant). The commanded rate is clamped to steer_rate_rads.
att_kp: 4.0
att_ki: 0.0
att_kd: 1.2
# Deadband, radians: once the nose is within this angle of the target the
# autopilot HALTS (commands zero) instead of forever chasing the sub-degree
# jitter of a live prograde/maneuver direction - that endless chase is the
# "constant sine flipping" this kills. ~0.02 rad = ~1.1 deg. Widen it if the
# nose still hunts; narrow it for a tighter (but twitchier) hold.
att_deadband_rad: 0.02

# Third-person chase camera (client). Ported from the JS RocketCamera
# (src/rocket/RocketCamera.ts + ROCKET_CONFIG.CAMERA). The camera orbits the
# rocket on a sphere and always looks at it:
#
#   mouse         - orbit around the rocket (azimuth + elevation)
#   scroll wheel  - zoom, one notch = zoom_step of the current distance
#   W/S A/D       - pitch / yaw the ROCKET (not the camera)
#   Q/R           - roll
#   Space (hold)  - burn the active engine along the nose
#   X             - jettison the spent stage
#
# Only distance/azimuth/elevation are smoothed - the camera's anchor and up
# are read rigidly off the rocket, so it stays welded to the ship and only
# your own input eases in.
[camera]
distance_m: 20         # resting distance behind the rocket
min_distance_m: 8      # zoom-in clamp
max_distance_m: 20000  # zoom-out clamp - far enough to frame a whole 10 km
                       # orbit; zooming out IS the manoeuvre/map view
elevation_rad: 0.3     # start angle above the rocket's horizon (~17 deg)
smooth_rate: 15.0      # orbit follow rate, 1/s: lerp = 1 - exp(-rate * dt)
mouse_sens: 0.005      # radians per mouse pixel
zoom_step: 0.1         # fraction of current distance per scroll notch (near)
zoom_step_far: 0.35    # bigger fraction past zoom_far_m - ship-scale to a
zoom_far_m: 100        # whole-orbit view in a flick, not fifty notches
planet_view_min_m: 800 # min orbit distance entering the tenebris-centred
                       # map view (the chase distance would sit inside rock)

# Reentry FX (client visual): plasma streaks when falling fast inside the
# lower atmosphere. Ramps min_speed -> full_speed; only below max_alt_m.
[reentry]
min_speed_mps: 45
full_speed_mps: 95
max_alt_m: 120

# Jettisoned-stage salvage: a staged booster becomes a tumbling ballistic
# body that heats up on reentry (a hull-hugging plasma shell wraps it) and
# leaves salvage on impact - metal scraps on land, the intact parts in the
# ocean. Air density for drag + heating reuses reentry.max_alt_m as the band
# (density 1 at the surface, 0 at the band top).
[salvage]
drag_coef: 0.02        # fractional speed lost/sec ~ drag_coef * density * speed
heat_ref: 1200000      # sqrt(density)*speed^3 that reads as full white-hot
heat_attack: 6.0       # glow ramp-up rate as it plunges in
heat_decay: 1.2        # glow cool-down rate
spin_rate: 1.4         # tumble of the shed stack (rad/s)
scrap_min: 2           # metal scraps from a stage that hits land
scrap_max: 4

# Engine exhaust plume (client visual): drawn while the ride is actually
# burning fuel - crossed additive ribbons from the nozzle down the thrust
# axis, bright core fading to the tip colour, flickering.
[plume]
length_m: 14.0         # full-throttle plume length
width_m: 1.5           # half-width at the nozzle
core_r: 1.0            # bright core colour at the nozzle (additive)
core_g: 0.92
core_b: 0.65
tip_r: 1.0             # tail colour the plume fades toward
tip_g: 0.32
tip_b: 0.06
flicker: 0.22          # length/width jitter fraction (the flame's dance)
flicker_hz: 26.0       # flicker pulses per second
segments: 7            # ribbon segments (colour-gradient resolution)
