# Solar-system scale + the sun's rendered disc and surface look.
# Parsed by core/config.rs parse_solar (tiny key: value subset; colours
# are [r, g, b] lists).
#
# A field set to 0 / omitted keeps the compiled-in default.
#
# System scale:
#   sun_distance_m     distance from the home world (Tenebris) to the
#                      star, metres. The WHOLE system scales with it:
#                      every star-orbiting body's structural orbit radius
#                      (orbit.rs elements) is multiplied by
#                      sun_distance_m / Tenebris's structural radius, so
#                      the system keeps its shape while the star recedes.
#                      Moon orbits are untouched.
#   sun_visual_dist_m  where the sun's DISC is drawn, metres from the
#                      active body's centre along the sun direction. Must
#                      stay inside the camera zfar (20 km). The disc is
#                      angular-size-correct for sun_distance_m, so this
#                      knob moves the billboard, not the look.
#   sun_radius_m       the star's "physical" radius, metres. Sets the
#                      sun's angular size in the sky: drawn radius =
#                      sun_radius_m * (sun_visual_dist_m / sun_distance_m).
#
# Surface shader (sun.fs.glsl - granulation / spots / limb / rim):
#   sun_color_hot       granule-core colour (HDR >1 ok)
#   sun_color_cool      granule-lane colour between convection cells
#   sun_color_spot      sunspot colour
#   sun_granule_scale   noise scale on the unit sphere (higher = finer)
#   sun_churn_speed     surface churn animation speed
#   sun_limb_power      limb-darkening curve power
#   sun_limb_strength   limb-darkening strength 0..1
#   sun_rim_boost       hot fresnel rim boost at the limb
#   sun_spot_threshold  sunspot field threshold 0..1 (higher = fewer)
#   sun_spot_sharpness  sunspot edge band width
#   sun_warp_amount     domain-warp amount (0 = calm, 2 = boiling)
#   sun_brightness      overall surface brightness multiplier
#
# 3D orbital map view (O key) camera:
#   map_zfar_m               map camera far plane (must cover the system)
#   map_min_dist_mult        closest approach to a body, x its radius
#   map_ship_min_dist_m      closest approach to the ship, metres
#   map_max_dist_m           zoom-out ceiling, metres from the focus
#   map_ship_default_dist_m  camera distance when the map opens on the ship
#   map_drag_sens            drag-orbit sensitivity, radians per pixel
#   map_zoom_step            wheel zoom step multiplier per notch
#   map_teleport             >0.5 shows a WARP button on each map card that
#                            jumps the ship/player to that body or station
#                            (debug/creative). 0 hides it.
solar:
  sun_distance_m: 150000
  sun_visual_dist_m: 18000
  sun_radius_m: 9000
  # Star gravitational parameter GM (m^3/s^2) in the heliocentric physics
  # frame - how hard the sun pulls. v_circ = sqrt(gm / r); at Tenebris's
  # 150 km orbit gm 3.75e8 -> ~50 m/s (period ~5 h). Raise for faster/tighter
  # solar orbits, lower for lazier transfers. 0 disables solar gravity.
  sun_gravity_param: 3.75e8
  sun_color_hot: [1.40, 1.25, 0.90]
  sun_color_cool: [1.10, 0.55, 0.16]
  sun_color_spot: [0.55, 0.22, 0.10]
  sun_granule_scale: 7.0
  sun_churn_speed: 0.03
  sun_limb_power: 0.7
  sun_limb_strength: 0.55
  sun_rim_boost: 0.8
  sun_spot_threshold: 0.68
  sun_spot_sharpness: 0.08
  sun_warp_amount: 1.6
  sun_brightness: 0.7
  map_zfar_m: 1500000
  map_min_dist_mult: 2.5
  map_ship_min_dist_m: 20
  map_max_dist_m: 800000
  map_ship_default_dist_m: 300
  map_drag_sens: 0.008
  map_zoom_step: 1.25
  map_teleport: 1.0
