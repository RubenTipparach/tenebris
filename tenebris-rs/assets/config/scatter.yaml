# Decorative surface scatter - grass tufts, flowers, rocks, bushes on
# land; kelp + seaweed on the sea floor. Parsed by core/scatter.rs
# (tiny key: value subset). All placement is a deterministic per-tile
# hash and the geometry is baked straight into each terrain chunk's
# mesh, so thousands of pieces render inside the existing chunk draw
# calls at zero per-instance cost.
#
# A field set to 0 / omitted keeps the compiled-in default; set a
# *_chance to a negative value to switch that scatter kind off.
#
#   grass_chance     probability a grass surface tile grows grass
#   grass_blades     blades per covered tile (upper bound, hash ~60-100%)
#   grass_height_m   blade height in metres (+-30% per-blade hash)
#   grass_blade_w_m  blade half-width at the base in metres
#   flower_chance    probability a grass surface tile gets a flower
#   flower_height_m  flower stem height in metres
#   rock_chance      probability a bare (dirt/sand/stone) tile gets a rock
#   rock_size_m      rock footprint radius in metres
#   bush_chance      probability a grass/dirt tile gets a leafy bush
#   bush_size_m      bush footprint radius in metres
#   kelp_chance      probability an underwater tile grows a kelp stalk
#   kelp_seg_m       height of one kelp ribbon segment in metres
#   kelp_max_segs    max segments per stalk (water depth also caps it)
#   cactus_chance    probability a DESERT sand tile grows a cactus
#   cactus_height_m  cactus trunk height (m)
#   cactus_radius_m  cactus trunk radius (m)
#   weed_chance      probability an underwater tile grows seaweed
#   weed_height_m    seaweed blade height in metres
#   fern_chance      probability a JUNGLE grass tile grows a fern rosette
#   fern_height_m    fern frond length in metres
#   reed_chance      probability a SWAMP grass/dirt tile grows reeds
#   reed_height_m    reed (cattail) stalk height in metres
#   shrub_chance     probability a DESERT sand / TUNDRA snow tile grows
#                    a dead shrub
#   shrub_size_m     dead-shrub twig length in metres
scatter:
  grass_chance: 0.8
  grass_blades: 18
  grass_height_m: 0.55
  grass_blade_w_m: 0.085
  flower_chance: 0.12
  flower_height_m: 0.32
  rock_chance: 0.1
  rock_size_m: 0.16
  bush_chance: 0.05
  bush_size_m: 0.34
  kelp_chance: 0.2
  kelp_seg_m: 0.65
  kelp_max_segs: 6
  cactus_chance: 0.16
  cactus_height_m: 2.2
  cactus_radius_m: 0.22
  weed_chance: 0.35
  weed_height_m: 0.3
  fern_chance: 0.45
  fern_height_m: 0.75
  reed_chance: 0.5
  reed_height_m: 1.1
  shrub_chance: 0.14
  shrub_size_m: 0.38
