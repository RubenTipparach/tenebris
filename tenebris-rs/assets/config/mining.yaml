# mining.yaml - survival mining + ore-vein tuning, parsed by core/mining.rs
#
# A field set to 0 (or omitted) keeps the compiled-in default, matching
# the other config files.
#
# Per-voxel probability that an underground stone block becomes each ore
# during worldgen (independent rolls - bigger = denser deposits).
coal_ore_chance: 0.040
copper_ore_chance: 0.022
tin_ore_chance: 0.018
iron_ore_chance: 0.030

# Break times (seconds). Base times are the IDEAL-tool times (shovel on
# soft ground, wood pickaxe on rock, axe on wood). A tool-wanting block
# broken by hand / with the wrong tool takes base * hand_penalty_mult.
# The higher pickaxe tiers scale the rock time down.
#
#   soft ground (dirt/sand/grass/snow/farmland): 2.5 s shovel, 5.0 s hand
#   rock + ore:                                  10 s wood pickaxe,
#                                                7 s stone, 4 s iron
#   wood:                                        1.5 s axe, 3.0 s hand
soft_break_s: 2.5
wood_break_s: 1.5
rock_break_s: 10.0
hand_penalty_mult: 2.0
stone_tool_mult: 0.7
iron_tool_mult: 0.4

# Blend strength (0..1) of the crack-stage texture painted over the
# block being mined (hex shader crack channel).
crack_alpha: 0.9

# Chance (0..1) that mining a rock/stone block also chips off a flint -
# the tier-1 tool material. (Flint is also foraged by right-clicking
# rocky ground with an empty hand.)
flint_from_stone_chance: 0.25

# Tool durability, in BLOCKS MINED before the tool breaks. One use = one
# block broken with that tool equipped (the selected hotbar slot); the
# tool is destroyed on its last use. Keyed by the material the tool is
# crafted from, so the smelting chain buys lifetime as well as speed:
#
#   flint  (pickaxe / axe / shovel): 200 blocks
#   stone  (pickaxe):                350 blocks
#   iron   (pickaxe):                500 blocks
#
# The hoe / bucket / fishing rod have no budget - they don't mine.
flint_tool_uses: 200
stone_tool_uses: 350
iron_tool_uses: 500
