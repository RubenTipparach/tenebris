# controls.yaml - keyboard bindings (client/controls.rs).
#
# Maps a game ACTION to the physical key(s) that trigger it. Remap a
# control by editing the key on its line; bind several keys to one action
# with a comma-separated list (e.g. "LeftShift, RightShift"). Any action
# left out here keeps its compiled-in default, so a partial file is fine.
#
# Key names: letters A..Z, number row Num0..Num9, Space, LeftShift /
# RightShift, LeftControl / RightControl, Tab, Enter. (Controller support
# will bind the same action names to pad buttons later - the game reads
# the action, never the raw key.)
#
# Actions:
#   move_forward / move_back / move_left / move_right - walk / fly
#   jump            - jump (and thrust up while flying / in space)
#   sprint          - run
#   fly_down        - descend while flying / in space
#   toggle_fly      - toggle creative fly mode
#   roll_left / roll_right - roll the rocket (roll_right folds into interact)
#   interact        - CONTEXT key: rolls the rocket right while riding; on
#                     foot boards a ship / opens the machine under the reticle
#                     / picks up a scattered item, or opens the inventory when
#                     there's no target
#   inventory       - open / close the player inventory (always available)
#   eat             - eat the selected food
#   plant           - plant a seed / till soil under the reticle
#   survival_toggle - survival/creative on foot; docks the station while riding
#   pause           - open / close the pause menu
#   tech_tree       - open / close the tech-tree progression screen
#   debug_ui        - master toggle for the debug UI
#   players_panel   - toggle the multiplayer players roster
#   profiler        - toggle the frame profiler overlay
#   pixel_ui_demo   - toggle the pixel-art UI demo panel
#   block_snapshot  - block capture: console snapshot + write a replayable
#                     .tenecap file of the collision neighbourhood (debug).
#                     Also fires on Shift+P. TENEBRIS_CAPTURE_DIR sets the dir.
#   flow_debug      - toggle the water-flow debug overlay (debug)
#   hotbar_1 .. hotbar_10 - select a hotbar slot

move_forward:    W
move_back:       S
move_left:       A
move_right:      D
jump:            Space
sprint:          LeftShift, RightShift
fly_down:        LeftControl, RightControl, C
# Creative fly toggle: R (F is intentionally unbound).
toggle_fly:      R
# Survival/creative on foot; while RIDING a rocket the same key docks the
# station instead (context-handled - you never switch modes mid-flight).
survival_toggle: G

# Menus.
pause:           Escape
tech_tree:       K
crafting:        B

# Rocket roll: Q rolls left. Roll RIGHT is folded into the E context key
# below (E rolls the rocket right WHILE RIDING), so roll_right is left
# unbound here. In JETPACK (fly mode) hold Shift with Q / E to roll the
# camera view (Shift is the sprint key, doubling as the roll modifier);
# releasing keeps the bank, leaving fly mode eases it back to level.
roll_left:       Q

# E is the CONTEXT key. WHILE RIDING a rocket it rolls right. ON FOOT it
# interacts - aim at a machine (chest, furnace, 3D printer, power generator,
# rocket pad, aquarium, ...) to open it, board a parked ship, or pick up a
# scattered item - and with no target it opens the inventory. Roll and
# inventory never overlap because riding and on-foot are mutually exclusive.
interact:        E

# Inventory: its OWN key, always available (E also opens it on foot when
# there's no interact target).
inventory:       Tab

eat:             V
plant:           T

# Jettison the current rocket stage while flying a staged rocket.
stage:           X

hotbar_1:        Num1
hotbar_2:        Num2
hotbar_3:        Num3
hotbar_4:        Num4
hotbar_5:        Num5
hotbar_6:        Num6
hotbar_7:        Num7
hotbar_8:        Num8
hotbar_9:        Num9
hotbar_10:       Num0

# ===================================================================
# DEBUG CONTROLS - developer tools. debug_ui is the master toggle; the
# render toggles + teleport menu only respond while it is on. These are
# kept separate from the normal controls above (and grouped under
# "Debug" in the in-game Inputs panel).
# ===================================================================
debug_ui:        F2
players_panel:   F1
profiler:        F3
pixel_ui_demo:   F8
block_snapshot:  F4
flow_debug:      F5
hide_terrain:    H
hide_water:      J
hide_skybox:     Y
teleport_menu:   M
