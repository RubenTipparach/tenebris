# fly.toml app configuration for the tenebris dedicated server -
# served by the RUST implementation (crates/tenebris-server).
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# CUTOVER NOTE: this config targets the PRODUCTION app 'tenebris-c'.
# The app name is an on-wire identifier (the clients' default server
# URL is wss://tenebris-c.fly.dev/ - see PORTING.md hard rule 1), so
# it keeps the C-era name even though the binary is the Rust port.
# Deploying this replaces the old C server's machines in place; the
# save format is byte-compatible by porting rule, so the Rust binary
# picks up the existing /data/saves on the app's volume as-is.
#
# Deploy (from tenebris-rs/, which is the whole build context):
#
#   fly deploy --config fly.toml
#
# or push to main / run the "Deploy server (Fly)" workflow - see
# .github/workflows/deploy-server.yml.
#
# Emergency rollback to the C server: its retired config still builds
# the C image against the same app + volume:
#
#   fly deploy tenebris-c --config tenebris-c/fly.toml.retired

app = 'tenebris-c'
primary_region = 'ord'

[build]
  # Resolved relative to this file: tenebris-rs/Dockerfile. The build
  # context is tenebris-rs/ - the image is fully self-contained per the
  # repo rule (no references into the C or JS trees).
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048

# Persistent volume so M6 chunk-diff saves survive every fly deploy.
# This is the SAME volume the C server wrote - the Rust server reads
# and extends those saves in place (byte-compatible format).
# IMPORTANT: do NOT re-run `fly launch --copy-config` — it strips this
# block silently and saves stop persisting on the next redeploy.
[[mounts]]
  source      = "tenebris_saves"
  destination = "/data"
