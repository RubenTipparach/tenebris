# Water surface tuning.
#
# Loaded at boot by config_load_water() and read each frame by the
# water shader's per-frame uniform upload (see body_draw_water in
# client/renderer.c) and once at mesh-build time by hex_mesh_build_water
# for the cap height.
#
# Fields:
#   depth_offset_m     float  drop the water cap this far BELOW the
#                             nominal sea-level radius. Has to exceed
#                             the maximum positive swell so wave crests
#                             never spill above neighbouring sand
#                             tiles (which sit AT sea level).
#   swell_amplitude    float  per-octave amplitude scale for the vertex
#                             swell. Total max displacement is roughly
#                             1.7× this value (three sin octaves at
#                             1.0 / 0.75 / 0.4 weights).
#   shine              float  specular highlight strength multiplier.
#                             Lower values = matte, less glossy water.
#   shine_power        float  Blinn-Phong specular exponent. Higher =
#                             tighter, smaller highlight.
#   opacity_low        float  alpha at grazing angles (Fresnel ~0).
#   opacity_high       float  alpha facing the camera (Fresnel ~1).
#                             Lower values let more terrain show
#                             through.
#   fog_distance_m     float  metres at which water colour fades fully
#                             into fog_color. Closer = murkier ocean.
#   fog_color          vec3   deep / hazy underwater tint applied via
#                             distance fog. Independent of the
#                             shallow/deep base colours.
#   refraction_amount  float  multiplier on the surface-gradient-driven
#                             colour shift that fakes refraction. 0 =
#                             flat, ~0.2 = visible shimmer.
#   foam_threshold     float  smoothstep lower edge for crest foam on
#                             the noise height field. Higher = less foam.

water:
  depth_offset_m:    0.30
  swell_amplitude:   0.05
  shine:             0.35
  shine_power:       80.0
  opacity_low:       0.45
  opacity_high:      0.80
  fog_distance_m:    80.0
  fog_color:         [0.04, 0.10, 0.18]
  refraction_amount: 0.15
  foam_threshold:    0.55
